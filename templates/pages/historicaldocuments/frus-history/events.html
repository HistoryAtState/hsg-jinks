<template>
    ---json
    {
        "templating": {
            "modules": {
                "https://history.state.gov/ns/templates/frus-history": { "at": "modules/templates/frus-history.xqm", "prefix": "fh" }
            },
            "extends": "templates/layouts/hsg-content.html"
        },
        "theme": {
            "layout": {
                "before": {
                    "toggle": false
                }
            }
        }
    }
    ---
    [# FRUS History events page (OP#1294), reference parity with hsg-shell
       pages/historicaldocuments/frus-history/events/index.xml: an Upcoming
       Events section only when any event is still to come, then Recent
       Events, each event's stored full-description fragment rendered as-is
       (fh:events). #]
    [% template breadcrumb %]
    <li>
        <nav aria-label="breadcrumb">
            <ul>
                <li>
                    <a href="[[ $context?context-path ]]/">
                        <pb-i18n key="breadcrumb.home">Home</pb-i18n>
                    </a>
                </li>
                <li>
                    <a href="[[ $context?context-path ]]/historicaldocuments">
                        <pb-i18n key="breadcrumb.historicaldocuments">Historical Documents</pb-i18n>
                    </a>
                </li>
                <li>
                    <a href="[[ $context?context-path ]]/historicaldocuments/frus-history">
                        <pb-i18n key="menu.frus-history">History of the Foreign Relations Series</pb-i18n>
                    </a>
                </li>
                <li aria-current="page">Events</li>
            </ul>
        </nav>
    </li>
    [% endtemplate %]

    <div class="section-landing usa-prose">
        [[ fh:events($context) ]]
    </div>

    [% template before %]
    [% include "templates/pages/historicaldocuments/sidebar.html" %]
    [[ fh:resources-panel($context, "publications documents research") ]]
    [% endtemplate %]
</template>
