<template>
    ---json
    {
        "templating": {
            "modules": {
                "https://history.state.gov/ns/templates/about": { "at": "modules/templates/about.xqm", "prefix": "about" }
            },
            "extends": "templates/layouts/hsg-content.html"
        },
        "theme": {
            "layout": {
                "before": {
                    "toggle": false
                }
            }
        }
    }
    ---
    [% template! title %]
    <title>[[ normalize-space(string-join(((if ($context?request?parameters?publication = 'faq') then 'FAQs' else about:monograph-title($context?request?parameters?publication)) || ' - About Us - Office of the Historian') ! string(.), ' ')) ]]</title>
    [% endtemplate %]

    <!--
        Shared TOC page for both FAQ and HAC (OP#1153): aboutapi:view-faq /
        aboutapi:view-hac pass which publication via the "publication" request
        parameter, read back through $context?request?parameters?publication
        in about:monograph-toc-breadcrumb / about:monograph-title, same
        pattern as departmenthistory's monograph-toc.html (short-history and
        buildings).
    -->
    [% template breadcrumb %]
    <li>
        <nav aria-label="breadcrumb">
            <ul typeof="BreadcrumbList" vocab="http://schema.org/">
                [[ hsg:breadcrumb-rdfa(about:monograph-toc-breadcrumb($context, $context?request?parameters?publication)) ]]
            </ul>
        </nav>
    </li>
    [% endtemplate %]

    <div class="section-landing usa-prose">
        <h1>[[ about:monograph-title($context?request?parameters?publication) ]]</h1>
        [[ about:monograph-toc($context, about:monograph-doc($context?request?parameters?publication), $context?request?parameters?publication, ()) ]]
    </div>

    [% template before %]
    [% include "templates/pages/about/sidebar.html" %]
    [% endtemplate %]
</template>
