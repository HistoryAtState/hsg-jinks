<template>
    ---json
    {
        "templating": {
            "modules": {
                "https://history.state.gov/ns/templates/departmenthistory": { "at": "modules/templates/departmenthistory.xqm", "prefix": "dh" }
            },
            "extends": "templates/layouts/hsg-content.html"
        },
        "theme": {
            "layout": {
                "before": {
                    "toggle": false
                }
            }
        }
    }
    ---
    [% template! title %]
    <title>[[ normalize-space(string-join((upper-case($context?request?parameters?letter) || ' - Principals and Chiefs Alphabetical Listing - People - Department History - Office of the Historian') ! string(.), ' ')) ]]</title>
    [% endtemplate %]

    [% template breadcrumb %]
    <li>
        <nav aria-label="breadcrumb">
            <ul typeof="BreadcrumbList" vocab="http://schema.org/">
                [[ hsg:breadcrumb-rdfa(dh:people-by-name-breadcrumb($context, $context?request?parameters?letter)) ]]
            </ul>
        </nav>
    </li>
    [% endtemplate %]

    <div class="usa-prose">
        <h1>Starting with [[ upper-case($context?request?parameters?letter) ]]</h1>
        [[ dh:people-by-name-nav($context, $context?request?parameters?letter) ]]
        [[ dh:people-list($context, dh:people-by-letter($context?request?parameters?letter)) ]]
        [[ dh:people-by-name-prev-next($context, $context?request?parameters?letter) ]]
    </div>

    [% template before %]
    [% include "templates/pages/departmenthistory/sidebar.html" %]
    [% endtemplate %]
</template>
