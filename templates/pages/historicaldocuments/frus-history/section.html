<template>
    ---json
    {
        "templating": {
            "modules": {
                "https://history.state.gov/ns/templates/frus-history": { "at": "modules/templates/frus-history.xqm", "prefix": "fh" }
            },
            "extends": "templates/layouts/historicaldocuments-content.html"
        },
        "theme": {
            "layout": {
                "before": {
                    "toggle": false
                }
            }
        }
    }
    ---
    [% template! title %]
    <title>[[ normalize-space(string-join(fh:head-label(fh:division($context?section-id)) ! string(.), '')) || ' - History of the Foreign Relations Series - Historical Documents - Office of the Historian' ]]</title>
    [% endtemplate %]

    [# Monograph division view (OP#1294): hsgapi:frus-history-section resolves
       the division server-side (unknown ids 404 there) and threads section-id
       into the context. Reference parity with hsg-shell's monograph-interior
       .xml: monograph title as the h2 navigation title, the division content
       through the ODD, prev/next between divisions in reading order, and the
       book TOC as the left sidebar with the current division highlighted
       (above the shared section navigation). #]
    [% template breadcrumb %]
    <li>
        <nav aria-label="breadcrumb">
            <ul typeof="BreadcrumbList" vocab="http://schema.org/">
                [[ hsg:breadcrumb-rdfa(fh:section-breadcrumb($context)) ]]
            </ul>
        </nav>
    </li>
    [% endtemplate %]

    [% template before %]
    [[ fh:toc-sidebar($context) ]]
    [% endtemplate %]

    <div class="hsg-frus__interior">
        [[ fh:navigation-title($context) ]]
        <div class="hsg-frus__prose usa-prose">
            [[ fh:section-content($context) ]]
            [[ fh:section-pagination($context) ]]
        </div>
    </div>
</template>
