    <div class="section-landing usa-prose">
        <h1>Quarterly Release of Newly Digitized <em>Foreign Relations</em> Volumes</h1>
        <p>March 1, 2018</p>
        <p>The Department of State today announces the release of newly digitized
            versions of seventeen volumes from the <em>Foreign Relations of the United
                States</em> series, the official documentary record of U.S. foreign
            relations. These volumes cover events that took place between 1886 and 1899
            and were originally published in print between 1889 and 1901:</p>
        <p>
            <em>Papers Relating to the Foreign Relations of the United States,</em>
            1886–1899</p>
        <ol>
            <li>
                <a href="[[ $context?context-path ]]/historicaldocuments/frus1888p1">Papers Relating to the
                    Foreign Relations of the United States, Transmitted to Congress,
                    With the Annual Message of the President, December 3, 1888, Part
                    I</a>.</li>
            <li>
                <a href="[[ $context?context-path ]]/historicaldocuments/frus1888p2">Papers Relating to the
                    Foreign Relations of the United States, Transmitted to Congress,
                    With the Annual Message of the President, December 3, 1888, Part
                    II</a>.</li>
            <li>
                <a href="[[ $context?context-path ]]/historicaldocuments/frus1889">Papers Relating to the
                    Foreign Relations of the United States, Transmitted to Congress,
                    With the Annual Message of the President, December 3, 1889</a>.</li>
            <li>
                <a href="[[ $context?context-path ]]/historicaldocuments/frus1890">Papers Relating to the
                    Foreign Relations of the United States, Transmitted to Congress,
                    With the Annual Message of the President, December 1, 1890</a>.</li>
            <li>
                <a href="[[ $context?context-path ]]/historicaldocuments/frus1891">Papers Relating to the
                    Foreign Relations of the United States, Transmitted to Congress,
                    With the Annual Message of the President, December 9, 1891</a>.</li>
            <li>
                <a href="[[ $context?context-path ]]/historicaldocuments/frus1892">Papers Relating to the
                    Foreign Relations of the United States, Transmitted to Congress,
                    With the Annual Message of the President, December 5, 1892</a>.</li>
            <li>
                <a href="[[ $context?context-path ]]/historicaldocuments/frus1893">Papers Relating to the
                    Foreign Relations of the United States, With the Annual Message of
                    the President, Transmitted to Congress, December 4, 1893</a>.</li>
            <li>
                <a href="[[ $context?context-path ]]/historicaldocuments/frus1894">Papers Relating to the
                    Foreign Relations of the United States, With the Annual Message of
                    the President, Transmitted to Congress, December 3, 1894</a>.</li>
            <li>
                <a href="[[ $context?context-path ]]/historicaldocuments/frus1894Nicaragua">Foreign Relations
                    of the United States, 1894, Nicaragua (Mosquito Territory)</a>.</li>
            <li>
                <a href="[[ $context?context-path ]]/historicaldocuments/frus1894app1">Foreign Relations of the
                    United States, 1894, Appendix I, Chinese-Japanese War, Enforcement
                    of Regulation Respective to Fur Seals, Mosquito Territory, Affairs
                    at Bluefields, Claim of Antonio Maximo Mora, Import Duties on
                    Certain Products of Colombia, Haiti, and Venezuela, Affairs in the
                    Samoan Islands</a>.</li>
            <li>
                <a href="[[ $context?context-path ]]/historicaldocuments/frus1894app2">Foreign Relations of
                    United States, 1894, Appendix II, Affairs in Hawaii</a>.</li>
            <li>
                <a href="[[ $context?context-path ]]/historicaldocuments/frus1895p1">Papers Relating to the
                    Foreign Relations of the United States, With the Annual Message of
                    the President, Transmitted to Congress December 2, 1895, Part
                I</a>.</li>
            <li>
                <a href="[[ $context?context-path ]]/historicaldocuments/frus1895p2">Papers Relating to the
                    Foreign Relations of the United States, With the Annual Message of
                    the President, Transmitted to Congress December 2, 1895, Part
                II</a>.</li>
            <li>
                <a href="[[ $context?context-path ]]/historicaldocuments/frus1896">Papers Relating to the
                    Foreign Relations of the United States, With the Annual Message of
                    the President Transmitted to Congress December 7, 1896, and the
                    Annual Report of the Secretary of State</a>.</li>
            <li>
                <a href="[[ $context?context-path ]]/historicaldocuments/frus1897"> Papers Relating to the
                    Foreign Relations of the United States, With the Annual Message of
                    the President Transmitted to Congress December 6, 1897</a>.</li>
            <li>
                <a href="[[ $context?context-path ]]/historicaldocuments/frus1898">Papers Relating to the
                    Foreign Relations of the United States, With the Annual Message of
                    the President Transmitted to Congress December 5, 1898</a>.</li>
            <li>
                <a href="[[ $context?context-path ]]/historicaldocuments/frus1899">Papers Relating to the
                    Foreign Relations of the United States, With the Annual Message of
                    the President Transmitted to Congress December 5, 1899</a>.</li>
        </ol>
        <p>Today’s release is part of the Office of the Historian’s ongoing project, in
            partnership with the University of Wisconsin Digital Collections Center, to
            digitize the entire <em>Foreign Relations</em> series. The University
            graciously provided high quality scanned images of each printed book, which
            the Office further digitized to create a full text searchable edition. These
            volumes are available online and as free ebooks at the Office of the
            Historian’s website (<a href="[[ $context?context-path ]]/historicaldocuments"
                >https://history.state.gov/historicaldocuments</a>). This is the latest
            in a series of quarterly releases, which will continue until the
                <em>FRUS</em> digital archive is complete.</p>
    </div>
