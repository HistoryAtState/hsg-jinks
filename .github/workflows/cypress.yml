name: Cypress

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cypress-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cypress:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out the app
        uses: actions/checkout@v4

      # The baseline is the image the app goes live with: eXist 7 with the
      # libraries, the HistoryAtState data packages and frus-data-jinks (with
      # its vector index) baked into the database. Port 8080 is what
      # .devcontainer/init.sh and cypress.config.cjs expect. Pinned to the
      # same digest as .devcontainer/Dockerfile.dev.
      - name: Start the baseline image
        run: |
          docker run -d --name exist -p 8080:8080 joewiz/hsg-project:v2@sha256:99cbf7e1bb1c37d28f4a0e815e3cc2614ad2c3b519312982134c450a68345930
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/exist/rest/db || true)
            echo "attempt $i: HTTP $code"
            [ "$code" = "200" ] && exit 0
            sleep 5
          done
          docker logs exist | tail -100
          exit 1

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .tool-versions
          cache: npm

      - name: Install dependencies
        run: |
          npm ci
          npm install -g @existdb/xst@4.1.0

      # Same seed path as the devcontainer: build the app xar with ant and
      # install it over the image's own hsg-jinks.
      - name: Install this build of the app
        run: sh .devcontainer/init.sh

      - name: Check the app answers
        run: curl -sf -o /dev/null http://localhost:8080/exist/apps/hsg-jinks/index.html

      - name: Run Cypress
        run: npx cypress run --config video=false

      # The production image builds with -Dproduction=true, which also drops
      # the base routes the controller sends to dedicated entry points (README
      # "Production Docker image"). Reinstall that build and check its routes.
      - name: Install the production build of the app
        env:
          EXISTDB_SERVER: http://localhost:8080/exist
          EXISTDB_USER: admin
          EXISTDB_PASS: ""
        run: |
          ant -Dproduction=true
          xst package install --force build/*.xar

      - name: Run the base-routes spec against the production build
        run: >-
          npx cypress run --config video=false
          --spec test/cypress/e2e/api/base-routes.cy.js
          --env PRODUCTION_BUILD=true

      - name: Upload screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-screenshots
          path: test/cypress/screenshots
          if-no-files-found: ignore

      - name: eXist log
        if: failure()
        run: docker logs exist 2>&1 | tail -300
