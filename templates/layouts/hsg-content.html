<template>
    ---json
    {
        "templating": {
            "modules": {
                "https://history.state.gov/ns/templates/hsg": { "at": "modules/templates/hsg.xqm", "prefix": "hsg" }
            },
            "extends": "templates/layouts/base.html"
        },
        "script": {
            "custom": [
                "resources/scripts/toc.js"
            ]
        },
        "theme": {
            "layout": {
                "class": "sticky-layout",
                "before": {
                    "collapsible": false
                },
                "after": {
                    "collapsible": false
                }
            }
        }
    }
    ---
    [% template title %]
    [# Every page carries "<page> - Office of the Historian" as its title
       (OP#1333). This default covers the doc-backed FRUS pages and falls
       back to the bare site name; page templates override it with their
       own [% template title %] where they know their heading. #]
    <title>[[ hsg:page-title(hsg:frus-page-title($context)) ]]</title>
    [% endtemplate %]

    [% template breadcrumb %]
    [% if exists($context?doc) %]
    <li>
        <nav aria-label="breadcrumb">
            <ul typeof="BreadcrumbList" vocab="http://schema.org/">
                [[ hsg:breadcrumb-rdfa(hsg:collection-breadcrumbs($context)) ]]
            </ul>
        </nav>
    </li>
    [% endif %]
    [% endtemplate %]

    [% template before %]
    [% if exists($context?doc) %]
    [[ hsg:volume-toc($context) ]]
    [% endif %]
    [% endtemplate %]

    [% template footer %]
    [% include "templates/footer.html" %]
    [% endtemplate %]

    <main>
        [% block above-content %][% endblock %]
        <!-- Content block -->
        [% block content %][% endblock %]
        [% block below-content %][% endblock %]
    </main>
    [% if exists($context?doc) %]
    <pb-document id="document1" path="[[ $context?doc?path ]]" odd="[[ $context?doc?odd ]]" view="[[ $context?doc?view ]]" root-path="[[ $config:data-root ]]" source-view="[[ $page:EXIDE ]]"></pb-document>
    [% endif %]
</template>
