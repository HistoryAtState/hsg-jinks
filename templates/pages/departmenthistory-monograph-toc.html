<template>
    ---json
    {
        "templating": {
            "modules": {
                "https://history.state.gov/ns/templates/departmenthistory": { "at": "modules/templates/departmenthistory.xqm", "prefix": "dh" }
            },
            "extends": "templates/layouts/hsg-content.html"
        }
    }
    ---
    <!--
        Shared TOC page for both Short History and Buildings (#1134):
        dhapi:short-history / dhapi:buildings pass which publication via the
        "publication" request parameter, read back through
        $context?request?parameters?publication in dh:monograph-toc-page /
        dh:monograph-toc-breadcrumb.
    -->
    [% template breadcrumb %]
    <li>
        <nav aria-label="breadcrumb">
            <ul>
                [[ dh:monograph-toc-breadcrumb($context, $context?request?parameters?publication) ]]
            </ul>
        </nav>
    </li>
    [% endtemplate %]

    <div class="section-landing usa-prose">
        [[ dh:monograph-toc-page($context, $context?request?parameters?publication) ]]
    </div>

    [% template after %]
    [% include "templates/departmenthistory-sidebar.html" %]
    [% endtemplate %]
</template>
