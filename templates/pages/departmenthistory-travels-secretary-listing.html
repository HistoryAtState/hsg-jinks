<template>
    ---json
    {
        "templating": {
            "modules": {
                "https://history.state.gov/ns/templates/departmenthistory": { "at": "modules/templates/departmenthistory.xqm", "prefix": "dh" }
            },
            "extends": "templates/layouts/hsg-content.html"
        },
        "theme": {
            "layout": {
                "before": {
                    "toggle": false,
                    "collapsible": false
                }
            }
        }
    }
    ---
    [% template breadcrumb %]
    <li>
        <nav aria-label="breadcrumb">
            <ul>
                [[ dh:travels-listing-breadcrumb($context, "secretary") ]]
            </ul>
        </nav>
    </li>
    [% endtemplate %]

    <div class="usa-prose">
        <h1>[[ dh:travels-listing-title("secretary", $context?request?parameters?personOrCountryId) ]]</h1>
        [[ dh:travels-listing-table($context, "secretary") ]]
    </div>

    [% template before %]
    [% include "templates/departmenthistory-sidebar.html" %]
    [% endtemplate %]
</template>
