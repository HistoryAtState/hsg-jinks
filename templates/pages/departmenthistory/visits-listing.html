<template>
    ---json
    {
        "templating": {
            "modules": {
                "https://history.state.gov/ns/templates/departmenthistory": { "at": "modules/templates/departmenthistory.xqm", "prefix": "dh" }
            },
            "extends": "templates/layouts/hsg-content.html"
        },
        "theme": {
            "layout": {
                "before": {
                    "toggle": false
                }
            }
        }
    }
    ---
    [% template! title %]
    <title>[[ normalize-space(string-join(((let $k := $context?request?parameters?countryOrYear return if (dh:visits-is-year($k)) then $k else normalize-space(dh:visits-by-country($k)[last()]/from)) || ' - Visits by Foreign Leaders - Department History - Office of the Historian') ! string(.), ' ')) ]]</title>
    [% endtemplate %]

    [% template breadcrumb %]
    <li>
        <nav aria-label="breadcrumb">
            <ul typeof="BreadcrumbList" vocab="http://schema.org/">
                [[ hsg:breadcrumb-rdfa(dh:visits-listing-breadcrumb($context)) ]]
            </ul>
        </nav>
    </li>
    [% endtemplate %]

    <div class="usa-prose">
        <h1>[[ dh:visits-listing-title($context?request?parameters?countryOrYear) ]]</h1>
        [[ dh:visits-listing-table($context?request?parameters?countryOrYear) ]]
    </div>

    [% template before %]
    [% include "templates/pages/departmenthistory/sidebar.html" %]
    [% endtemplate %]
</template>
