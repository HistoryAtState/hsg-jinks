<template>
    ---json
    {
        "templating": {
            "modules": {
                "https://history.state.gov/ns/templates/departmenthistory": { "at": "modules/templates/departmenthistory.xqm", "prefix": "dh" }
            },
            "extends": "templates/layouts/hsg-content.html"
        },
        "theme": {
            "layout": {
                "before": {
                    "toggle": false
                }
            }
        }
    }
    ---
    <!--
        Shared chapter/subchapter page for both Short History and Buildings
        (#1135): dhapi:short-history-section / dhapi:buildings-section
        resolve the division server-side and pass "publication" +
        "sectionId" as request parameters, read back through
        $context?request?parameters in dh:current-section.
    -->
    [% template breadcrumb %]
    <li>
        <nav aria-label="breadcrumb">
            <ul typeof="BreadcrumbList" vocab="http://schema.org/">
                [[ hsg:breadcrumb-rdfa(dh:monograph-section-breadcrumb($context)) ]]
            </ul>
        </nav>
    </li>
    [% endtemplate %]

    [% template before %]
    [[ dh:monograph-section-sidebar($context) ]]
    [% endtemplate %]

    <div class="usa-prose">
        [% if $context?request?parameters?publication = 'short-history' %]
        [% include "templates/pages/departmenthistory/short-history-notice-brief.html" %]
        [% endif %]
        [[ dh:monograph-section-content($context) ]]
        [[ dh:monograph-section-pagination($context) ]]
    </div>
</template>
