<template>
    ---json
    {
        "templating": {
            "modules": {
                "https://history.state.gov/ns/templates/frus-history": { "at": "modules/templates/frus-history.xqm", "prefix": "fh" }
            },
            "extends": "templates/layouts/hsg-content.html"
        },
        "theme": {
            "layout": {
                "before": {
                    "toggle": false
                }
            }
        }
    }
    ---
    [% template! title %]
    <title>History of the Foreign Relations Series - Office of the Historian</title>
    [% endtemplate %]

    [# Monograph landing page for the FRUS History subsection (OP#1294),
       reference parity with hsg-shell pages/historicaldocuments/frus-history/
       index.xml: complete title, editors, edition info, the static blurb
       paragraph, then the full book TOC. The sidebar carries the ebook
       download panel (data-derived, see fh:download-panel) and the FRUS
       History Resources panel above the shared section navigation. #]
    [% template breadcrumb %]
    <li>
        <nav aria-label="breadcrumb">
            <ul typeof="BreadcrumbList" vocab="http://schema.org/">
                <li typeof="ListItem" property="itemListElement">
                    <a href="[[ $context?context-path ]]/" typeof="WebPage" property="item">
                        <pb-i18n key="breadcrumb.home">Home</pb-i18n>
                    </a>
                </li>
                <li typeof="ListItem" property="itemListElement">
                    <a href="[[ $context?context-path ]]/historicaldocuments" typeof="WebPage" property="item">
                        <pb-i18n key="breadcrumb.historicaldocuments">Historical Documents</pb-i18n>
                    </a>
                </li>
                <li aria-current="page" typeof="ListItem" property="itemListElement">
                    <pb-i18n key="menu.frus-history">History of the Foreign Relations Series</pb-i18n>
                </li>
            </ul>
        </nav>
    </li>
    [% endtemplate %]

    <div class="section-landing usa-prose">
        <h1>[[ fh:monograph-title($context) ]]</h1>
        [[ fh:monograph-editors($context) ]]
        [[ fh:monograph-edition-info($context) ]]
        <p>
            <em>Toward &#8220;Thorough, Accurate, and Reliable&#8221;</em> explores the
            evolution of the <em>Foreign Relations of the United States</em>
            documentary history series from its antecedents in the early republic
            through the early 21st century implementation of its current mandate,
            the 1991 <em>Foreign Relations</em> statute. This book traces how
            policymakers and an expanding array of stakeholders translated values
            like &#8220;security,&#8221; &#8220;legitimacy,&#8221; and &#8220;transparency&#8221; into practice as they
            debated how to balance the government&#8217;s obligation to protect sensitive
            information with its commitment to openness. Determining the &#8220;people&#8217;s
            right to know&#8221; has fueled lively discussion for over two centuries, and
            this work provides important, historically informed perspectives
            valuable to policymakers and engaged citizens as that conversation
            continues.</p>
        <hr/>
        <div class="toc-inner">
            [[ fh:monograph-toc($context) ]]
        </div>
    </div>

    [% template before %]
    [% include "templates/pages/historicaldocuments/sidebar.html" %]
    [[ fh:download-panel($context) ]]
    [[ fh:resources-panel($context, "documents research events") ]]
    [% endtemplate %]
</template>
