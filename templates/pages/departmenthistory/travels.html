<template>
    ---json
    {
        "templating": {
            "modules": {
                "https://history.state.gov/ns/templates/departmenthistory": { "at": "modules/templates/departmenthistory.xqm", "prefix": "dh" }
            },
            "extends": "templates/layouts/hsg-content.html"
        },
        "theme": {
            "layout": {
                "before": {
                    "toggle": false
                }
            }
        }
    }
    ---
    [% template! title %]
    <title>Travels - Department History - Office of the Historian</title>
    [% endtemplate %]

    [% template breadcrumb %]
    <li>
        <nav aria-label="breadcrumb">
            <ul typeof="BreadcrumbList" vocab="http://schema.org/">
                [[ hsg:breadcrumb-rdfa(dh:breadcrumb($context, (map{"label": "Presidential and Secretaries Travels Abroad", "href": "/departmenthistory/travels"}))) ]]
            </ul>
        </nav>
    </li>
    [% endtemplate %]

    <div class="section-landing usa-prose">
        <h1>Presidential and Secretaries Travels Abroad</h1>
        <p>These separate lists of
            <a href="[[ $context?context-path ]]/departmenthistory/travels/president">Presidential
                Travel Abroad</a>
            and
            <a href="[[ $context?context-path ]]/departmenthistory/travels/secretary">Secretaries
                Travel Abroad</a>
            present basic historical information on all trips taken outside the United States by
            Presidents and Secretaries of State.</p>
        <p>Up-to-date information on foreign travel by the Secretary of State is at
            <a href="https://www.state.gov/travels-with-the-secretary-of-state/">Travels With the
                Secretary</a>.</p>
    </div>

    [% template before %]
    [% include "templates/pages/departmenthistory/sidebar.html" %]
    [% endtemplate %]
</template>
