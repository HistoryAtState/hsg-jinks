<template>
    ---json
    {
        "templating": {
            "modules": {
                "https://history.state.gov/ns/templates/about": { "at": "modules/templates/about.xqm", "prefix": "about" }
            },
            "extends": "templates/layouts/hsg-content.html"
        },
        "theme": {
            "layout": {
                "before": {
                    "toggle": false
                }
            }
        }
    }
    ---
    [% template! title %]
    <title>Content Warning - About Us - Office of the Historian</title>
    [% endtemplate %]

    [% template breadcrumb %]
    [[ hsg:breadcrumbs($context, hsg:section-trail("about", (map { "label": "Content Warning" }))) ]]
    [% endtemplate %]

    <div class="section-landing usa-prose">
        <h1>Content Warning</h1>
        <div class="usa-alert usa-alert--warning">
            <div class="usa-alert__body">
                <p class="usa-alert__text">Readers are advised that some of the historical primary
                    sources included in the Office of the Historian&#8217;s printed and online
                    publications may contain offensive language. The Office does not alter the
                    language used in original primary source documents, except to excise
                    information required by the law.</p>
            </div>
        </div>
    </div>

    [% template before %]
    [% include "templates/pages/about/sidebar.html" %]
    [% endtemplate %]
</template>
