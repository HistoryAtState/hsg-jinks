<template>
    ---json
    {
        "templating": {
            "extends": "templates/layouts/hsg-content.html"
        },
        "theme": {
            "layout": {
                "before": {
                    "toggle": false
                }
            }
        }
    }
    ---
    [% template breadcrumb %]
    <li>
        <nav aria-label="breadcrumb">
            <ul>
                <li>
                    <a href="[[ $context?context-path ]]/">
                        <pb-i18n key="breadcrumb.home">Home</pb-i18n>
                    </a>
                </li>
                <li>
                    <a href="[[ $context?context-path ]]/historicaldocuments">
                        <pb-i18n key="breadcrumb.historicaldocuments">Historical Documents</pb-i18n>
                    </a>
                </li>
                <li aria-current="page">
                    <pb-i18n key="menu.other-electronic-resources">Other Electronic Resources</pb-i18n>
                </li>
            </ul>
        </nav>
    </li>
    [% endtemplate %]

    [# Static resource list ported verbatim from hsg-shell
       pages/historicaldocuments/other-electronic-resources.xml (OP#1300); Bootstrap's
       list-unstyled becomes the USWDS unstyled-list classes, the same swap the countries
       and principals-chiefs pages made. #]
    <div class="section-landing usa-prose">
        <h1>Electronic Resources for U.S. Foreign Relations</h1>
        <p>A growing number of primary source materials relating to U.S. foreign relations
            are available online. The Office of the Historian maintains this list as a
            resource for the public and will continue to update it as more resources are
            made available.</p>
        <h2>Declassified Document Collections</h2>
        <ul class="usa-list usa-list--unstyled">
            <li>
                <a href="https://www.foia.cia.gov">Central Intelligence Agency, Freedom of
                    Information Electronic Reading Room</a>
            </li>
            <li>
                <a href="http://www.dod.mil/pubs/foi/rdroom.html">Department of Defense,
                    Freedom of Information Electronic Reading Room</a>
            </li>
            <li>
                <a href="https://foia.state.gov/">Department of State, Freedom of
                    Information Electronic Reading Room</a>
            </li>
            <li>
                <a href="https://nsarchive.gwu.edu/postings/briefing-books">National
                    Security Archive, Electronic Briefing Books</a>
            </li>
        </ul>
        <h2>Department of State Telegrams</h2>
        <ul class="usa-list usa-list--unstyled">
            <li>
                <a href="https://aad.archives.gov/aad/series-list.jsp?cat=WR43">National
                    Archives and Records Administration, Access to Archival Databases</a>
            </li>
        </ul>
        <h2>Public Papers of the Presidents of the United States</h2>
        <ul class="usa-list usa-list--unstyled">
            <li>
                <a href="http://www.presidency.ucsb.edu/">University of California at Santa
                    Barbara American Presidency Project</a>
            </li>
        </ul>
        <h2>Association of Southeast Asian Nations</h2>
        <ul class="usa-list usa-list--unstyled">
            <li>
                <a href="http://asean.org/documents-archive-copy/">Documents and Archive</a>
            </li>
        </ul>
        <h2>Ford Presidency Materials</h2>
        <ul class="usa-list usa-list--unstyled">
            <li>
                <a href="http://www.fordlibrarymuseum.gov/collections-digital.aspx">Ford
                    Library Electronic Resources</a>
            </li>
        </ul>
        <h2>Nixon Presidency Materials</h2>
        <ul class="usa-list usa-list--unstyled">
            <li>
                <a href="https://www.nixonlibrary.gov/virtuallibrary">Nixon Library
                    Electronic Resources</a>
            </li>
        </ul>
        <h2>United Nations Materials</h2>
        <ul class="usa-list usa-list--unstyled">
            <li>
                <a href="https://unyearbook.un.org/">Yearbook of the United Nations</a>
            </li>
        </ul>
        <h2>Pre-1861 Resources</h2>
        <ul class="usa-list usa-list--unstyled">
            <li>
                <a href="[[ $context?context-path ]]/historicaldocuments/pre-1861">Our list of resources for
                    research on pre-1861 topics in U.S. foreign relations.</a>
            </li>
        </ul>
    </div>
    [% template before %]
    [% include "templates/pages/historicaldocuments/sidebar.html" %]
    [% endtemplate %]
</template>
