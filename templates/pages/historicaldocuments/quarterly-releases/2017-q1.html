    <div class="section-landing usa-prose">
        <h1>Quarterly Release of Newly Digitized <em>Foreign Relations</em> Volumes</h1>
        <p>April 6, 2017</p>
        <p>The Department of State today announces the release of newly digitized
            versions of sixteen volumes from the <em>Foreign Relations of the United
                States</em> series, the official documentary record of U.S. foreign
            relations. These volumes cover events that took place between 1912 and 1918
            and were originally published in print between 1919 and 1933.</p>
        <p>The Office of the Historian is releasing this material documenting World War
            I on the centennial of the U.S. entry into the war to commemorate that event
            and to honor those who served in that conflict. The Office plans to release
            the related material on the Versailles peace negotiations in the next
            quarterly release, scheduled for June 2017. In addition, the Office of the
            Historian is publishing a narrative account of the response by U.S.
            diplomats in Europe to the humanitarian catastrophe that accompanied the
            beginning of the war. This narrative will be published sequentially at <a
                href="[[ $context?context-path ]]/departmenthistory/wwi"
                >https://history.state.gov/departmenthistory/wwi</a>.</p>
        <p>
            <em>Papers Relating to the Foreign Relations of the United States,</em>

            <li>

        <p>Today’s release is part of the Office of the Historian’s ongoing project, in
            partnership with the University of Wisconsin Digital Collections Center, to
            digitize the entire <em>Foreign Relations</em> series. The University
            graciously provided high quality scanned images of each printed book, which
            the Office further digitized to create a full text searchable edition. These
            volumes are available online and as free ebooks at the Office of the
            Historian’s website (<a href="[[ $context?context-path ]]/historicaldocuments"
                >https://history.state.gov/historicaldocuments</a>). This is the latest
            in a series of <a href="[[ $context?context-path ]]/historicaldocuments/quarterly-releases"
                >quarterly releases</a>, which will continue until the 
            <em>FRUS</em> digital archive is complete.</p>
