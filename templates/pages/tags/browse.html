<template>
    ---json
    {
        "templating": {
            "modules": {
                "https://history.state.gov/ns/templates/tags": { "at": "modules/templates/tags.xqm", "prefix": "tags" }
            },
            "extends": "templates/layouts/hsg-content.html"
        },
        "theme": {
            "layout": {
                "before": {
                    "toggle": false
                }
            }
        }
    }
    ---
    [% template breadcrumb %]
    [[ hsg:breadcrumbs($context, hsg:section-trail("tags", (map{"label": tags:taxonomy-label($context?request?parameters?tagId)}))) ]]
    [% endtemplate %]

    <div class="usa-prose">
        [[ tags:show-tag($context) ]]
    </div>

    [% template before %]
    [% include "templates/pages/tags/sidebar.html" %]
    [% endtemplate %]
</template>
