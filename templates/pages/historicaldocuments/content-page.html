<template>
    ---json
    {
        "templating": {
            "modules": {
                "https://history.state.gov/ns/templates/hsg": { "at": "modules/templates/hsg.xqm", "prefix": "hsg" }
            },
            "extends": "templates/layouts/historicaldocuments-content.html"
        },
        "theme": {
            "layout": {
                "before": {
                    "toggle": false
                }
            }
        }
    }
    ---
    [% template! title %]
    <title>[[ normalize-space(string-join(((if ($context?page-id = 'about-frus') then 'About the Foreign Relations Series - Historical Documents' else hsg:content-title($context, $context?page-id)) || ' - Office of the Historian') ! string(.), ' ')) ]]</title>
    [% endtemplate %]

    [% template breadcrumb %]
    [[ hsg:breadcrumbs($context, hsg:section-trail("historicaldocuments", hsg:crumb-i18n("menu." || $context?page-id, hsg:content-title($context, $context?page-id), ()))) ]]
    [% endtemplate %]

    [# One template for every data-driven static of the section (OP#1313, PR #50
       review): the content lives in data/content/{page-id}.xml, rendered
       through the default ODD; page-id arrives from hsgapi:content-page, and
       the breadcrumb falls back to the content document's own title when the
       menu.{page-id} i18n key is absent. #]
    <div class="section-landing usa-prose">
        [[ hsg:content-page($context, $context?page-id) ]]
    </div>
</template>
