name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cypress:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out the app
        uses: actions/checkout@v4

      # The baseline is the image the app goes live with: eXist 7 with the
      # libraries and the HistoryAtState data packages baked into the database.
      # It does not carry frus-tei, which is installed further down. Port 8080
      # is what .devcontainer/init.sh and cypress.config.cjs expect.
      - name: Start the baseline image
        run: |
          docker run -d --name exist -p 8080:8080 joewiz/hsg-project:latest
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/exist/rest/db || true)
            echo "attempt $i: HTTP $code"
            [ "$code" = "200" ] && exit 0
            sleep 5
          done
          docker logs exist | tail -100
          exit 1

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .tool-versions
          cache: npm

      - name: Install dependencies
        run: |
          npm ci
          npm install -g @existdb/xst@4.1.0

      # Images built from Jinntec/hsg-project#32 on carry frus-tei, the whole
      # corpus, indexed at build time. Older images do not, and installing the
      # frus-tei release here takes hours to index. For those, CI builds
      # frus-tei's default xar instead: the curated volume subset listed in
      # its build.xml. Only those volumes are checked out.
      - name: Check out frus-tei
        uses: actions/checkout@v4
        with:
          repository: HistoryAtState/frus-tei
          path: frus-tei
          filter: blob:none
          sparse-checkout: resources

      - name: Install the FRUS data
        working-directory: frus-tei
        env:
          EXISTDB_SERVER: http://localhost:8080/exist
          EXISTDB_USER: admin
          EXISTDB_PASS: ""
        run: |
          if xst package list | grep -qx frus-tei; then
            echo "frus-tei is in the image"
            exit 0
          fi
          sed -n 's#.*<include name="\(data/[^/]*\)/\*\*" />.*#\1 .last-modified/\1#p' build.xml > volumes
          [ -s volumes ]
          xargs git sparse-checkout add < volumes
          ant xar
          xst package install build/frus-tei.xar

      # The image ships Roaster 2; hsg-jinks still declares Roaster 1 until
      # the Roaster 2 upgrade lands.
      - name: Downgrade Roaster to 1.13.1
        env:
          EXISTDB_SERVER: http://localhost:8080/exist
          EXISTDB_USER: admin
          EXISTDB_PASS: ""
        run: |
          curl -fsSL -o roaster.xar https://github.com/eeditiones/roaster/releases/download/v1.13.1/roaster-1.13.1.xar
          xst package install roaster.xar

      # Same seed path as the devcontainer, but with the build the production
      # image ships (ant -Dproduction=true, README "Production Docker image"),
      # installed over the image's own hsg-jinks.
      - name: Install the production build of the app
        env:
          PRODUCTION: "true"
        run: sh .devcontainer/init.sh

      - name: Check the app answers
        run: curl -sf -o /dev/null http://localhost:8080/exist/apps/hsg-jinks/

      - name: Run Cypress
        run: npx cypress run --config video=false --env PRODUCTION_BUILD=true

      - name: Upload screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-screenshots
          path: test/cypress/screenshots
          if-no-files-found: ignore

      - name: eXist log
        if: failure()
        run: docker logs exist 2>&1 | tail -300

  commitlint:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: wagoid/commitlint-github-action@v6
