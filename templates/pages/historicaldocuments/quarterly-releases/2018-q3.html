    <div class="section-landing usa-prose">
        <h1>Quarterly Release of Newly Digitized <em>Foreign Relations</em> Volumes</h1>
        <p>August 23, 2018</p>
        <p>The Department of State today announces the release of newly digitized
            versions of fifteen volumes from the <em>Foreign Relations of the United
                States</em> series, the official documentary record of U.S. foreign
            relations. These volumes cover events that took place between 1866 and 1873
            and were originally published in print between 1868 and 1874:</p>
        <p>
            <em>Papers Relating to the Foreign Relations of the United States,</em>
            1867-1874</p>
        <ol>
            <li>
                <a href="[[ $context?context-path ]]/historicaldocuments/frus1867p1">Papers Relating to the
                    Foreign Affairs, 1867 Accompanying the Annual Message of the
                    President to the Second Session of the Fortieth Congress, Part
                I</a>.</li>
            <li>
                <a href="[[ $context?context-path ]]/historicaldocuments/frus1867p2">Papers Relating to the
                    Foreign Affairs, 1867 Accompanying the Annual Message of the
                    President to the Second Session of the Fortieth Congress, Part
                    II</a>.</li>
            <li>
                <a href="[[ $context?context-path ]]/historicaldocuments/frus1868p1">Papers Relating to the
                    Foreign Affairs, 1868 Accompanying the Annual Message of the
                    President to the Third Session of the Fortieth Congress, Part
                I</a>.</li>
            <li>
                <a href="[[ $context?context-path ]]/historicaldocuments/frus1868p2">Papers Relating to the
                    Foreign Affairs, 1868 Accompanying the Annual Message of the
                    President to the Third Session of the Fortieth Congress, Part
                II</a>.</li>
            <li>
                <a href="[[ $context?context-path ]]/historicaldocuments/frus1870">Papers Relating to the
                    Foreign Relations of the United States, 1870 Transmitted to
                    Congress, With the Annual Message of the President, December 5,
                    1870</a>.</li>
            <li>
                <a href="[[ $context?context-path ]]/historicaldocuments/frus1871">Papers Relating to the
                    Foreign Relations of the United States, 1871 Transmitted to
                    Congress, With the Annual Message of the President, December 4,
                    1871</a>.</li>
            <li>
                <a href="[[ $context?context-path ]]/historicaldocuments/frus1872p1">Papers Relating to the
                    Foreign Relations of the United States, 1872 Transmitted to
                    Congress, With the Annual Message of the President, December 2,
                    1872, Part I</a>.</li>
            <li>
                <a href="[[ $context?context-path ]]/historicaldocuments/frus1872p2v1">Papers Relating to the
                    Foreign Relations of the United States, 1872 Papers Relating to the
                    Treaty of Washington, Part II, Volume I</a>.</li>
            <li>
                <a href="[[ $context?context-path ]]/historicaldocuments/frus1872p2v2">Papers Relating to the
                    Foreign Relations of the United States, 1872 Papers Relating to the
                    Treaty of Washington, Part II, Volume II</a>.</li>
            <li>
                <a href="[[ $context?context-path ]]/historicaldocuments/frus1872p2v3">Papers Relating to the
                    Foreign Relations of the United States, 1872 Papers Relating to the
                    Treaty of Washington, Part II, Volume III</a>.</li>
            <li>
                <a href="[[ $context?context-path ]]/historicaldocuments/frus1872p2v4">Papers Relating to the
                    Foreign Relations of the United States, 1872 Papers Relating to the
                    Treaty of Washington, Part II, Volume IV</a>.</li>
            <li>
                <a href="[[ $context?context-path ]]/historicaldocuments/frus1872p2v5">Papers Relating to the
                    Foreign Relations of the United States, 1872 Papers Relating to the
                    Treaty of Washington, Part II, Volume V</a>.</li>
            <li>
                <a href="[[ $context?context-path ]]/historicaldocuments/frus1873p1v1">Papers Relating to the
                    Foreign Relations of the United States, 1873 General Correspondence;
                    and Papers Relating to Naturalization and Expatriation, Part I,
                    Volume I</a>.</li>
            <li>
                <a href="[[ $context?context-path ]]/historicaldocuments/frus1873p1v2">Papers Relating to the
                    Foreign Relations of the United States, 1873 General Correspondence;
                    and Papers Relating to Naturalization and Expatriation, Part I,
                    Volume II</a>.</li>
            <li>
                <a href="[[ $context?context-path ]]/historicaldocuments/frus1873p2v3">Papers Relating to the
                    American and British Joint Claims Commission, Part II, Volume
                    III</a>.</li>
        </ol>
        <p>Today’s release is part of the Office of the Historian’s ongoing project, in
            partnership with the University of Wisconsin Digital Collections Center, to
            digitize the entire <em>Foreign Relations</em> series. The University
            graciously provided high quality scanned images of each printed book, which
            the Office further digitized to create a full text searchable edition. These
            volumes are available online and as free ebooks at the Office of the
            Historian’s website (<a href="[[ $context?context-path ]]/historicaldocuments"
                >https://history.state.gov/historicaldocuments</a>). This is the latest
            in a series of quarterly releases, which will continue until the
                <em>FRUS</em> digital archive is complete.</p>
    </div>
