    [# Static index ported verbatim from hsg-shell pages/historicaldocuments/pre-1861/index.xml
       (OP#1302). The serial-set link 404s until the Serial Set landing (OP#1303) lands; kept
       context-path-relative under the section's transitional policy. #]
    <div class="section-landing usa-prose">
        <h1>Pre-1861 U.S. foreign relations materials</h1>
        <p>The <em>Foreign Relations of the United States</em>
            <a href="[[ $context?context-path ]]/historicaldocuments/frus-history">began publication in 1861</a>.
            Prior to that time, the U.S. government released documents through a variety of
            means.</p>
        <p>One of those means was the U.S. Congressional Serial Set, which began publication
            in 1817. Your local library may hold the Serial Set or subscribe to an
            electronic database which contains these documents. Two indexes of foreign
            affairs-related documents in the Serial Set are available:</p>
        <ul>
            <li>Between 1914 and 1921, Adelaide Rosalia Hasse compiled a three-volume <a
                    href="https://catalog.hathitrust.org/api/volumes/oclc/1100023.html">
                    <em>Index to United States Documents Relating to Foreign Affairs,
                        1828-1861</em>
                </a>, available online in full text via the Hathi Trust.</li>
            <li>
                <a href="[[ $context?context-path ]]/historicaldocuments/pre-1861/serial-set">U.S. foreign
                    relations materials in the pre-1861 U.S. Congressional Serial Set</a>: A
                much shorter index of the foreign affairs material in the Serial Set,
                compiled by the Office of the Historian.</li>
        </ul>
        <p>Other sources for early U.S. foreign affairs documentation are also available
            online. These include:</p>
        <ul>
            <li>
                <a href="http://memory.loc.gov/ammem/amlaw/lwsp.html">
                    <em>American State Papers</em>
                </a>, which covers 1789 to 1838 and is available online via the Library of
                Congress.</li>
            <li>
                <a href="https://founders.archives.gov/">
                    <em>Founders Online</em>
                </a>, which includes documents from the papers of Secretaries of State
                Thomas Jefferson, James Madison, and James Monroe, among others.</li>
        </ul>
    </div>
