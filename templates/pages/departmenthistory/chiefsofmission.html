<template>
    ---json
    {
        "templating": {
            "modules": {
                "https://history.state.gov/ns/templates/departmenthistory": { "at": "modules/templates/departmenthistory.xqm", "prefix": "dh" }
            },
            "extends": "templates/layouts/hsg-content.html"
        },
        "theme": {
            "layout": {
                "before": {
                    "toggle": false,
                    "collapsible": false
                }
            }
        }
    }
    ---
    [% template breadcrumb %]
    <li>
        <nav aria-label="breadcrumb">
            <ul>
                [[ dh:breadcrumb($context, (map{"label": "People", "href": "/departmenthistory/people"}, map{"label": "Chiefs of Mission", "href": "/departmenthistory/people/chiefsofmission"})) ]]
            </ul>
        </nav>
    </li>
    [% endtemplate %]

    <div class="section-landing usa-prose">
        <h1>Chiefs of Mission</h1>
        [% include "templates/pages/departmenthistory/hiatus-notice.html" %]
        <ul class="usa-list">
            <li>
                <a href="[[ $context?context-path ]]/departmenthistory/people/chiefsofmission/by-country">Listed
                    Alphabetically, by Country</a>
            </li>
            <li>
                <a href="[[ $context?context-path ]]/departmenthistory/people/chiefsofmission/by-organization">Listed
                    By International Organization</a>
            </li>
        </ul>
    </div>

    [% template before %]
    [% include "templates/pages/departmenthistory/sidebar.html" %]
    [% endtemplate %]
</template>
