<template>
    ---json
    {
        "templating": {
            "modules": {
                "https://history.state.gov/ns/templates/hsg": { "at": "modules/templates/hsg.xqm", "prefix": "hsg" }
            },
            "extends": "templates/layouts/historicaldocuments-content.html"
        },
        "theme": {
            "layout": {
                "before": {
                    "toggle": false
                }
            }
        }
    }
    ---
    [% template breadcrumb %]
    [[ hsg:breadcrumbs($context, hsg:section-trail("historicaldocuments", (hsg:crumb-i18n("menu.quarterly-releases", "Quarterly Releases", "/historicaldocuments/quarterly-releases"), hsg:crumb(replace($context?release-id, "^(\d+)-q(\d)$", "$1 Quarter $2"), ())))) ]]
    [% endtemplate %]

    [# One template for all ten frozen announcement pages (OP#1313): the content
       lives in data/content/quarterly-releases/{release-id}.xml, the TEI ports
       of the statics originally transcribed into ten sibling templates
       (OP#1295); release-id arrives from hsgapi:quarterly-release. #]
    <div class="section-landing usa-prose">
        [[ hsg:content-page($context, "quarterly-releases/" || $context?release-id) ]]
    </div>
</template>
