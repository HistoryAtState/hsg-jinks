<template>
    ---json
    {
        "templating": {
            "modules": {
                "https://history.state.gov/ns/templates/departmenthistory": { "at": "modules/templates/departmenthistory.xqm", "prefix": "dh" }
            },
            "extends": "templates/layouts/hsg-content.html"
        }
    }
    ---
    [% template breadcrumb %]
    <li>
        <nav aria-label="breadcrumb">
            <ul>
                [[ dh:chiefs-by-organization-breadcrumb($context) ]]
            </ul>
        </nav>
    </li>
    [% endtemplate %]

    <!-- hsg-shell's page title wrongly reads "By Country" here; fixed. -->
    <div class="usa-prose">
        <h1>Chiefs of Mission, Listed by International Organization</h1>
        [[ dh:chiefs-by-organization-list($context) ]]
    </div>

    [% template after %]
    [% include "templates/departmenthistory-sidebar.html" %]
    [% endtemplate %]
</template>
