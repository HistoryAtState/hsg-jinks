<template>
    ---json
    {
        "templating": {
            "modules": {
                "https://history.state.gov/ns/templates/serial-set": { "at": "modules/templates/serial-set.xqm", "prefix": "sset" }
            },
            "extends": "templates/layouts/historicaldocuments-content.html"
        },
        "theme": {
            "layout": {
                "before": {
                    "toggle": false
                }
            }
        }
    }
    ---
    [% template! title %]
    <title>[[ normalize-space(string-join((sset:region-and-or-subject-name($context) || ' - U.S. foreign relations materials in the pre-1861 U.S. Congressional Serial Set - Pre-1861 U.S. Foreign Relations Materials - Historical Documents - Office of the Historian') ! string(.), ' ')) ]]</title>
    [% endtemplate %]

    [% template breadcrumb %]
    [[ hsg:breadcrumbs($context, sset:browse-trail($context)) ]]
    [% endtemplate %]

    [# Filtered record table ported from hsg-shell
       pages/historicaldocuments/pre-1861/serial-set/browse.xml (OP#1305), driven by the
       region/subject query parameters. Full-width like the reference (no aside), hence no
       sidebar include. #]
    <div class="section-landing usa-prose">
        <h1>U.S. Congressional Serial Set: Documents on
            [[ sset:region-and-or-subject-name($context) ]] before 1861</h1>
        <p>[[ sset:filtered-count($context) ]] sources, in chronological order.</p>
        [[ sset:filtered-table($context) ]]
    </div>
</template>
