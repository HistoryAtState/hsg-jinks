<html>
    <head>
        <meta charset="utf-8"/>
        <title>TEI Publisher API Documentation</title>
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swagger-ui-dist@4.18.1/swagger-ui.min.css"/>
        <script src="https://cdn.jsdelivr.net/npm/swagger-ui-dist@4.18.1/swagger-ui-bundle.min.js" charset="UTF-8"/>
    </head>
    <body>
        <div id="swagger"/>
        <div id="custom"/>
        
        <div id="hsgapi"/>
         
        <div id="countryapi"/>
         
        <div id="dhapi"/>
         
        <div id="tagapi"/>
        
        <script>
            window.onload = function() {
                SwaggerUIBundle({
                    url: "modules/lib/api.json",
                    dom_id: '#swagger',
                    displayOperationId: true,
                    displayRequestDuration: true,
                    showExtensions: true,
                    withCredentials: true
                });

                
                SwaggerUIBundle({
                    url: "modules/hsg-api.json",
                    dom_id: '#hsgapi',
                    displayOperationId: true,
                    displayRequestDuration: true,
                    showExtensions: true,
                    withCredentials: true
                });
                 
                SwaggerUIBundle({
                    url: "modules/countries-api.json",
                    dom_id: '#countryapi',
                    displayOperationId: true,
                    displayRequestDuration: true,
                    showExtensions: true,
                    withCredentials: true
                });
                 
                SwaggerUIBundle({
                    url: "modules/departmenthistory-api.json",
                    dom_id: '#dhapi',
                    displayOperationId: true,
                    displayRequestDuration: true,
                    showExtensions: true,
                    withCredentials: true
                });
                 
                SwaggerUIBundle({
                    url: "modules/tags-api.json",
                    dom_id: '#tagapi',
                    displayOperationId: true,
                    displayRequestDuration: true,
                    showExtensions: true,
                    withCredentials: true
                });
                
            }
        </script>
    </body>
</html>
