<template>
    ---json
    {
        "templating": {
            "modules": {
                "https://history.state.gov/ns/templates/serial-set": { "at": "modules/templates/serial-set.xqm", "prefix": "sset" }
            },
            "extends": "templates/layouts/historicaldocuments-content.html"
        },
        "theme": {
            "layout": {
                "before": {
                    "toggle": false
                }
            }
        }
    }
    ---
    [% template! title %]
    <title>All - U.S. foreign relations materials in the pre-1861 U.S. Congressional Serial Set - Pre-1861 U.S. Foreign Relations Materials - Historical Documents - Office of the Historian</title>
    [% endtemplate %]

    [% template breadcrumb %]
    <li>
        <nav aria-label="breadcrumb">
            <ul typeof="BreadcrumbList" vocab="http://schema.org/">
                <li typeof="ListItem" property="itemListElement">
                    <a href="[[ $context?context-path ]]/" typeof="WebPage" property="item">
                        <pb-i18n key="breadcrumb.home">Home</pb-i18n>
                    </a>
                </li>
                <li typeof="ListItem" property="itemListElement">
                    <a href="[[ $context?context-path ]]/historicaldocuments" typeof="WebPage" property="item">
                        <pb-i18n key="breadcrumb.historicaldocuments">Historical Documents</pb-i18n>
                    </a>
                </li>
                <li typeof="ListItem" property="itemListElement">
                    <a href="[[ $context?context-path ]]/historicaldocuments/pre-1861" typeof="WebPage" property="item">
                        <pb-i18n key="menu.pre-1861">Pre-1861 U.S. foreign relations materials</pb-i18n>
                    </a>
                </li>
                <li typeof="ListItem" property="itemListElement">
                    <a href="[[ $context?context-path ]]/historicaldocuments/pre-1861/serial-set" typeof="WebPage" property="item">
                        <pb-i18n key="menu.serial-set">U.S. Congressional Serial Set</pb-i18n>
                    </a>
                </li>
                <li aria-current="page" typeof="ListItem" property="itemListElement">All</li>
            </ul>
        </nav>
    </li>
    [% endtemplate %]

    [# Full bibliography table ported from hsg-shell
       pages/historicaldocuments/pre-1861/serial-set/all.xml (OP#1304). Full-width like the
       reference (no aside), hence no sidebar include. #]
    <div class="section-landing usa-prose">
        <h1>U.S. Congressional Serial Set: All Documents on U.S. foreign relations before
            1861</h1>
        <p>[[ sset:bibls-count($context) ]] sources, in chronological order.</p>
        [[ sset:filtered-table($context) ]]
    </div>
</template>
