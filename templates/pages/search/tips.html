    [% template! title %]
    <title>Tips - Search - Office of the Historian</title>
    [% endtemplate %]

    [% template breadcrumb %]
    [[ hsg:breadcrumbs($context, hsg:section-trail("search", hsg:crumb("Tips", ()))) ]]
    [% endtemplate %]

    <div class="usa-prose">
        <h1>Search Tips</h1>
        <p>The Office of the Historian's <a href="[[ $context-path ]]/search">search engine</a> contains
        several useful search options. Understanding the search engine's defaults, as
        well as the following techniques and syntax, will help improve your search
        results. Example searches linked below will pre-fill the search form with the
        parameters of your search to see the results.</p>

        <h2 id="defaults">Defaults</h2>
        <ul class="usa-list">
            <li>By default, the search engine returns documents from the entire site<sup>&#8224;</sup>
            containing <strong>all</strong> of the search terms you enter. (Note: Before December
            2017, the search engine's default behavior was to return documents containing
            <strong>any</strong> of the terms. To perform that kind of search now, just place an
            <a href="#booleans">OR</a> boolean operator between each term.)</li>
            <li>All keyword searches are <strong>case-insensitive</strong>, so searching
            for "SALT" will return the same results as searching for "salt."</li>
            <li>You can refine a query by:
                <ol class="usa-list">
                    <li>narrowing its scope to specific sections of the website;</li>
                    <li>using phrase, boolean, wildcard, and proximity operators in your keyword search; and</li>
                    <li>filtering results by date and time ranges or specific <em>Foreign Relations</em> volumes.</li>
                </ol>
            </li>
        </ul>
        <p><sup>&#8224;</sup> Note that the search engine's results are limited to the
        materials that the Office of the Historian has digitized. Please consult the
        full list of <em>Foreign Relations</em> volumes <a href="[[ $context-path ]]/historicaldocuments">by administration</a>
        to see which volumes have been digitized (indicated by the phrase, "full text," next to
        each volume's title). For early <em>FRUS</em> volumes not yet available here, we provide
        links to the <a href="https://uwdc.library.wisc.edu/collections/FRUS/">University of
        Wisconsin Madison <em>FRUS</em> collection</a>, or in some circumstances, WorldCat.</p>

        <h2 id="scope">Scope</h2>
        <p>Beneath the keyword search field is a set of checkboxes, labeled "Filter by
        Section." Selecting any of the checkboxes can narrow the scope of your
        search to specific sections of the website, resulting in a faster, more
        specific query. The default set of checkboxes contains the major content sections of the website:</p>
        <ul class="usa-list">
            <li>Historical Documents &#8212; Includes <em>Foreign Relations of the United States</em> documents</li>
            <li>Department History &#8212; Includes Principal Officers and Chiefs of Mission, Travels
            of the President and Secretary, Visits of Foreign Leaders, etc.</li>
            <li>Countries &#8212; Includes Guide to the United States' History of Recognition,
            Diplomatic, and Consular Relations, by Country, since 1776</li>
            <li>Conferences &#8212; Includes Transcripts of conferences held by the Office of the Historian</li>
            <li>History of the <em>Foreign Relations</em> Series</li>
            <li>About &#8212; Includes FAQ, Advisory Committee Minutes</li>
            <li>Retired Resources &#8212; Includes Milestones, Education</li>
        </ul>
        <p>To search for articles about U.S. diplomatic history that relate to peace,
        you could select these two sections and enter the keyword "peace":</p>
        <div class="usa-summary-box">
            <div class="usa-summary-box__body">
                <p>&#9745; Department History<br/>&#9745; Retired Resources (Milestones)</p>
                <p><a href="[[ $context-path ]]/search?q=peace&amp;within=department&amp;within=retired&amp;sort-by=relevance">peace</a> (click to try this search)</p>
            </div>
        </div>
        <p>If no scope checkboxes are selected, the entire site will be searched. To
        achieve the best results, combine scope with the following keyword search operators:</p>

        <h2 id="keywords">Searching with Keywords</h2>
        <h3 id="phrases">Phrases</h3>
        <p>When you type your search terms into the box, the search engine will
        search for those terms, individually, anywhere in a document. To force
        the search engine to find fixed phrases (i.e., specific, ordered
        combinations of words), place the phrase in quotation marks. To locate
        documents which include both "peaceful" and "nuclear" anywhere in the text, use the following search:</p>
        <div class="usa-summary-box"><div class="usa-summary-box__body">
            <a href="[[ $context-path ]]/search?q=peaceful+nuclear&amp;within=entire-site&amp;sort-by=relevance">peaceful nuclear</a>
        </div></div>
        <p>To locate documents which use the phrase "peaceful nuclear," use this search:</p>
        <div class="usa-summary-box"><div class="usa-summary-box__body">
            <a href="[[ $context-path ]]/search?q=%22peaceful+nuclear%22&amp;within=entire-site&amp;sort-by=relevance">"peaceful nuclear"</a>
        </div></div>

        <h3 id="booleans">Booleans</h3>
        <p>The search engine will allow you to perform Boolean searches (AND, OR,
        and NOT). Boolean operators must be in all caps.</p>
        <p>You can use Boolean operators with individual terms or with phrases
        enclosed in quotation marks. For example, to locate documents which
        include both the word "Kissinger" and the phrase "peaceful nuclear," use this search:</p>
        <div class="usa-summary-box"><div class="usa-summary-box__body">
            <a href="[[ $context-path ]]/search?q=Kissinger+%22peaceful+nuclear%22&amp;sort-by=relevance">Kissinger "peaceful nuclear"</a>
        </div></div>
        <p>To locate documents which include either "Rhodesia" or "Zimbabwe," use this search:</p>
        <div class="usa-summary-box"><div class="usa-summary-box__body">
            <a href="[[ $context-path ]]/search?q=Rhodesia+OR+Zimbabwe&amp;within=entire-site&amp;sort-by=relevance">Rhodesia OR Zimbabwe</a>
        </div></div>
        <p>To locate documents which include the phrase "arms control" but exclude
        documents which also include the term "SALT," use this search:</p>
        <div class="usa-summary-box"><div class="usa-summary-box__body">
            <a href="[[ $context-path ]]/search?q=%22arms++control%22+NOT+SALT&amp;within=entire-site&amp;sort-by=relevance">"arms control" NOT SALT</a>
        </div></div>
        <p>You can also use the plus (+) and minus (-) signs to include or exclude
        certain terms. To search for documents which must include the phrase
        "law of the sea" and may include the term "seabed," use this search:</p>
        <div class="usa-summary-box"><div class="usa-summary-box__body">
            <a href="[[ $context-path ]]/search?q=%2B%22law+of+the+sea%22+seabed&amp;within=entire-site&amp;sort-by=relevance">+"law of the sea" seabed</a>
        </div></div>
        <p>To search for documents which include "Korea" but not "DMZ," use this search:</p>
        <div class="usa-summary-box"><div class="usa-summary-box__body">
            <a href="[[ $context-path ]]/search?q=Korea+-DMZ&amp;within=entire-site&amp;sort-by=relevance">Korea -DMZ</a>
        </div></div>
        <p>Finally, you can use parentheses to nest your searches. To find documents
        which include "Guatemala" or "El Salvador" and "Belize," use this search:</p>
        <div class="usa-summary-box"><div class="usa-summary-box__body">
            <a href="[[ $context-path ]]/search?q=(Guatemala+OR+%22El+Salvador%22)+AND+Belize&amp;within=entire-site&amp;sort-by=relevance">(Guatemala OR "El Salvador") AND Belize</a>
        </div></div>

        <h3 id="wildcards">Wildcards</h3>
        <p>If you are unsure about the spelling of a term or want to find variants
        of a term, you can use wildcards. The search engine supports two
        wildcard characters: ? and *.</p>
        <p>If you want to replace a single letter in your search term, use ? in your
        query. To find documents which include "text" or "test," use this search:</p>
        <div class="usa-summary-box"><div class="usa-summary-box__body">
            <a href="[[ $context-path ]]/search?q=te%3Ft&amp;within=entire-site&amp;sort-by=relevance">te?t</a>
        </div></div>
        <p>Note that the above search will not return hits for "Tet" or "teapot." If
        you want to replace zero or more letters in your search term use * in
        your query. For example, to find documents which include "Vietnam" and "Vietnamese," use this search:</p>
        <div class="usa-summary-box"><div class="usa-summary-box__body">
            <a href="[[ $context-path ]]/search?q=Vietna*&amp;within=entire-site&amp;sort-by=relevance">Vietna*</a>
        </div></div>
        <p>Note that the above search will not return hits for "Viet Nam," another
        spelling of the same country. You may have to try multiple variants of the same search to get all the results you need.</p>

        <h3 id="proximity">Proximity</h3>
        <p>If you are searching for common words, you can tell the search engine to
        only return documents in which the words are within a distance you
        define. To find documents which include "Cuba" and "submarine" within 10
        words of each other, use this search:</p>
        <div class="usa-summary-box"><div class="usa-summary-box__body">
            <a href="[[ $context-path ]]/search?q=%22Cuba+submarine%22~10&amp;within=entire-site&amp;sort-by=relevance">"Cuba submarine"~10</a>
        </div></div>
        <p>We are aware that "keyword in context" summaries of the results of
        proximity searches are not displaying correctly. The search results themselves, however, are reliable.</p>

        <h2 id="dates-filter">Filtering By Date and Time</h2>
        <ul class="usa-list">
            <li>Date and time filters may be applied to searches within the Historical
            Documents (<em>Foreign Relations</em> series) section of the site. These
            filters will be active only if the Historical Documents section is checked.</li>
            <li>Exact dates or date-time ranges may be used in conjunction with keywords
            and/or volumes, or used alone by leaving the search box blank.</li>
            <li>Date and time filters may be used at the beginning of a search or to refine the results of a search.</li>
            <li>Per U.S. conventions, dates should be entered in Month-Date-Year format
            and time in 12-hour format, with "am" or "pm" selected.</li>
        </ul>

        <h3 id="exact-date">Exact Date</h3>
        <p>To search or filter results by an exact date, enter a single date into
        the "Start Date" set of fields. For example, a search for historical
        documents dated December 7, 1941 should be entered as:</p>
        <table class="usa-table">
            <caption>Start Date</caption>
            <thead><tr><th scope="col">Month</th><th scope="col">Day</th><th scope="col">Year</th></tr></thead>
            <tbody><tr><td>12</td><td>07</td><td>1941</td></tr></tbody>
        </table>
        <p><a href="[[ $context-path ]]/search?q=&amp;within=documents&amp;start-date=1941-12-07&amp;sort-by=date-asc">live example</a></p>

        <h3 id="exact-date-time">Exact Date and Time</h3>
        <p>To search or filter results by an exact date and time, enter a single
        date into the "Start Date" set of fields and a single time into the
        "Start Time" set of fields. For example, a search for historical
        documents created on December 7, 1941 at 8 p.m. should be entered as:</p>
        <table class="usa-table">
            <caption>Start Date / Start Time</caption>
            <thead><tr><th scope="col">Month</th><th scope="col">Day</th><th scope="col">Year</th><th scope="col">Hour</th><th scope="col">Minute</th></tr></thead>
            <tbody><tr><td>12</td><td>07</td><td>1941</td><td>8</td><td>00 pm</td></tr></tbody>
        </table>
        <p><a href="[[ $context-path ]]/search?q=&amp;within=documents&amp;start-date=1941-12-07&amp;start-time=20:00&amp;sort-by=relevance">live example</a></p>

        <h3 id="date-range">Date Range</h3>
        <p>To search or filter results by a date range, use the "Start Date" and
        "End Date" sets of fields. For example, a search for historical
        documents including the term "Cuba" and created between October 16, 1962
        and October 28, 1962 should be entered as:</p>
        <table class="usa-table">
            <caption>Start Date / End Date</caption>
            <thead><tr><th scope="col"></th><th scope="col">Month</th><th scope="col">Day</th><th scope="col">Year</th></tr></thead>
            <tbody>
                <tr><th scope="row">Start</th><td>10</td><td>16</td><td>1962</td></tr>
                <tr><th scope="row">End</th><td>10</td><td>28</td><td>1962</td></tr>
            </tbody>
        </table>
        <p><a href="[[ $context-path ]]/search?q=Cuba*&amp;within=documents&amp;start-date=1962-10-16&amp;end-date=1962-10-28&amp;sort-by=date-asc">live example</a></p>

        <h4 id="month-year">Month-Year</h4>
        <p>To search or filter results for all historical documents produced on
        any day during a particular month and year, use a date range search.
        For example, a search for historical documents including the terms
        "National Security Council" or "NSC" dated sometime in September 1974 should be entered as:</p>
        <p><a href="[[ $context-path ]]/search?q=%22National+Security+Council%22+OR+%22NSC%22&amp;within=documents&amp;start-date=1974-09-01&amp;end-date=1974-09-30&amp;sort-by=date-asc">live example</a> (start 1974-09-01, end 1974-09-30)</p>

        <h4 id="single-year">Single Year</h4>
        <p>To search or filter results for all historical documents produced
        during a particular year, use a date range search. For example, a
        search for historical documents including the term "Russia" and dated sometime in 1917 should be entered as:</p>
        <p><a href="[[ $context-path ]]/search?q=Russia*&amp;within=documents&amp;start-date=1917-01-01&amp;end-date=1917-12-31&amp;sort-by=date-asc">live example</a> (start 1917-01-01, end 1917-12-31)</p>

        <h4 id="year-range">Year Range</h4>
        <p>To search or filter results for all historical documents produced
        during a particular range of years, use a date range search. For
        example, a search for historical documents including the term
        "union" dated sometime between 1861 and 1865 should be entered as:</p>
        <p><a href="[[ $context-path ]]/search?q=union&amp;within=documents&amp;start-date=1861-01-01&amp;end-date=1865-12-31&amp;sort-by=relevance">live example</a> (start 1861-01-01, end 1865-12-31)</p>

        <h3 id="date-time-range">Date and Time Range</h3>
        <p>To search for all historical documents produced during a particular span
        of dates and times, use a date and time range search. For example, a
        search for all historical documents created or sent between noon on
        August 9, 1974 and 6:30 am on August 10, 1974 should be entered as:</p>
        <table class="usa-table">
            <caption>Start / End Date and Time</caption>
            <thead><tr><th scope="col"></th><th scope="col">Month</th><th scope="col">Day</th><th scope="col">Year</th><th scope="col">Time</th></tr></thead>
            <tbody>
                <tr><th scope="row">Start</th><td>08</td><td>09</td><td>1974</td><td>12:00 pm</td></tr>
                <tr><th scope="row">End</th><td>08</td><td>10</td><td>1974</td><td>6:30 am</td></tr>
            </tbody>
        </table>
        <p><a href="[[ $context-path ]]/search?q=&amp;within=documents&amp;start-date=1974-08-09&amp;end-date=1974-08-10&amp;start-time=12:00&amp;end-time=18:30&amp;sort-by=date-asc">live example</a></p>

        <h2 id="volumes-filter">Filtering By Volume</h2>
        <ul class="usa-list">
            <li>Volume filters may be applied to searches within the Historical
            Documents (<em>Foreign Relations</em> series) section of the site.</li>
            <li>Volumes may be used in conjunction with keywords and/or dates or used alone by leaving the search box blank.</li>
            <li>Volume filters may be used at the beginning of a search or to refine the results of a search.</li>
        </ul>
        <p>Taking the last example above, we can further refine the search results by
        checking one or more <em>Foreign Relations</em> volumes of interest. For
        example, a search for all historical documents created or sent between noon
        on August 9, 1974 and 6:30 am on August 10, 1974 and limited to the
        <em>1969&#8211;1976, Volume X, Vietnam, January 1973&#8211;July 1975</em> and
        <em>1969&#8211;1976, Volume XXXV, National Security Policy, 1973&#8211;1976</em>
        volumes should be entered as:</p>
        <p><a href="[[ $context-path ]]/search?q=&amp;volume-id=frus1969-76v10&amp;volume-id=frus1969-76v35&amp;within=documents&amp;start-date=1974-08-09&amp;end-date=1974-08-10&amp;start-time=12:00&amp;end-time=18:30&amp;sort-by=date-asc">live example</a></p>
    </div>
