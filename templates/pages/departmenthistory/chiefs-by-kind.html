<template>
    ---json
    {
        "templating": {
            "modules": {
                "https://history.state.gov/ns/templates/departmenthistory": { "at": "modules/templates/departmenthistory.xqm", "prefix": "dh" }
            },
            "extends": "templates/layouts/hsg-content.html"
        },
        "theme": {
            "layout": {
                "before": {
                    "toggle": false
                }
            }
        }
    }
    ---
    [% template! title %]
    <title>By Country - Chiefs of Mission - People - Department History - Office of the Historian</title>
    [% endtemplate %]

    <!--
        Shared by-country/by-organization index page (#1096 optimization
        pass, one template for two routes that only ever differed by which
        list function to call): dhapi:chiefs-by-country / dhapi:chiefs-by-
        organization pass which "kind" via the "kind" request parameter,
        read back through $context?request?parameters?kind. The two list
        functions stay separate (dh:chiefs-by-country-list returns a
        two-column alphabetical grid, dh:chiefs-by-organization-list a flat
        list; different shapes, not worth forcing into one), only the
        wrapping template is unified.
    -->
    [% template breadcrumb %]
    <li>
        <nav aria-label="breadcrumb">
            <ul>
                [[ dh:chiefs-by-kind-breadcrumb($context, $context?request?parameters?kind) ]]
            </ul>
        </nav>
    </li>
    [% endtemplate %]

    <div class="usa-prose">
        [% if $context?request?parameters?kind = 'country' %]
        <h1>Chiefs of Mission, Listed Alphabetically by Country</h1>
        [[ dh:chiefs-by-country-list($context) ]]
        [% else %]
        <h1>Chiefs of Mission, Listed by International Organization</h1>
        [[ dh:chiefs-by-organization-list($context) ]]
        [% endif %]
    </div>

    [% template before %]
    [% include "templates/pages/departmenthistory/sidebar.html" %]
    [% endtemplate %]
</template>
