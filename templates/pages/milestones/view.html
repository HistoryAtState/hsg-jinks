<template>
    ---json
    {
        "templating": {
            "modules": {
                "https://history.state.gov/ns/templates/milestones": { "at": "modules/templates/milestones.xqm", "prefix": "ms" }
            },
            "extends": "templates/layouts/hsg-content.html"
        },
        "theme": {
            "layout": {
                "before": {
                    "toggle": false
                }
            }
        }
    }
    ---
    [% template! title %]
    <title>Milestones in the History of U.S. Foreign Relations - Office of the Historian</title>
    [% endtemplate %]

    <!--
        Era landing page (OP#1162): table of contents only (foreword intro
        plus every article, no article body, no highlighted current item;
        there is nothing "current" one level above the TOC itself). Lighter
        than a historicaldocuments volume-landing page, which also renders
        front-matter prose inline; milapi:view already 404s an unresolvable
        eraId before this template is ever reached.
    -->
    [% template breadcrumb %]
    [[ hsg:breadcrumbs($context, ms:era-trail($context)) ]]
    [% endtemplate %]

    [% template before %]
    [[ ms:era-sidebar($context) ]]
    [% endtemplate %]

    <div class="usa-prose">
        <h1>Milestones in the History of U.S. Foreign Relations</h1>
        [% include "templates/pages/milestones/retirement-notice-brief.html" %]
        [[ ms:era-toc($context, ms:era-doc($context?request?parameters?eraId), $context?request?parameters?eraId, ()) ]]
    </div>
</template>
