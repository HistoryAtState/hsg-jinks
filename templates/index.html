<template>
    <!--
If the profile "landing" is selected together with "uswds",
this template will be used as the default landing page
-->---json
{
        "templating": {
            "extends": "templates/layouts/base.html"
        },
        "features": {
            "toolbar": {
                "enabled": false
            }
        },
        "styles": [
            "resources/css/landing-page.css", "transform/teipublisher.css"
        ],
        "script": {
            "custom": [
                "resources/scripts/language.js"
            ]
        },
        "theme": {
            "layout": {
                "class": "landing-layout"
            }
        }
    }
---
    [% template! title %]
    <title>Latest News - Office of the Historian</title>
    [% endtemplate %]

    [% template styles %]
    [% endtemplate %]
    [% template hero %]
    [% if $landing?content//tei:div[@type='hero'][p or list] %]
    <section class="hero usa-section">
        [[ landing:section($context, 'hero', $landing?content, 'uswds-landing.odd') ]]
    </section>
    [% endif %]
    [% if $landing?content//tei:div[@type='hero'][not(p) and not(list)] %]
    <section class="hero-title usa-section">
        [[ landing:section($context, 'hero', $landing?content, 'uswds-landing.odd') ]]
    </section>
    <div class="hero-media" role="img" aria-label="[[ $theme?landing?hero?label ]]"/>
    [% endif %]
    [% endtemplate %]
    [% block landing-intro %]
    [[ uswds:section($context, 'intro', $landing?content, 'uswds-landing.odd', 'section-intro') ]]
    [% endblock %]
    [% block landing-publications %]
    [[ uswds:cards($context, 'publications', $landing?content, 'uswds-landing.odd', ()) ]]
    [% endblock %]
    [% block landing-news %]
    [[ uswds:cards($context, 'news', $landing?content, 'uswds-landing.odd', ()) ]]
    [% endblock %]
    [[ uswds:section($context, 'about', $landing?content, 'uswds-landing.odd', ()) ]] [[
    uswds:section($context, 'highlights', $landing?content, 'uswds-landing.odd', ()) ]] [[
    uswds:section($context, 'team', $landing?content, 'uswds-landing.odd', ()) ]] [[
    uswds:section($context, 'section', $landing?content, 'uswds-landing.odd', ()) ]]
    [% template footer %]
    [% include "templates/footer.html" %]
    [% if $theme?identifier?enabled %]
    [% include "templates/identifier.html" %]
    [% endif %]
    [% endtemplate %]
</template>
