    <div class="section-landing usa-prose">
        <h1>Bibliographic Metadata of the <em>Foreign Relations of the United States</em>
            Series</h1>

        <p>The Office of the Historian is responsible, under law, for the preparation and
            publication of the official historical documentary record of U.S. foreign policy in
            the <a href="[[ $context?context-path ]]/historicaldocuments">Foreign Relations of
                the United States</a> series. This dataset is the raw bibliographic metadata for
            the volumes in the series published since 1861. Each record in the dataset contains a
            volume's title, year of publication, years covered by the volume, and links to
            sources for these volumes online or in print, among other metadata items.</p>
        <p><a href="[[ $context?context-path ]]/open/frus-metadata.xml">Download the raw
                data</a> (XML)</p>
        <p>Visit the <a
                href="https://catalog.data.gov/dataset/bibliographical-metadata-of-the-foreign-relations-of-the-united-states-series"
                >Data.gov catalog entry</a> for this dataset.</p>
    </div>
