<template>
    ---json
    {
        "templating": {
            "modules": {
                "https://history.state.gov/ns/templates/frus-history": { "at": "modules/templates/frus-history.xqm", "prefix": "fh" }
            },
            "extends": "templates/layouts/hsg-content.html"
        },
        "theme": {
            "layout": {
                "before": {
                    "toggle": false
                }
            }
        }
    }
    ---
    [# FRUS History documents list (OP#1294), reference parity with hsg-shell
       pages/historicaldocuments/frus-history/documents/index.xml: static
       intro, then the sortable list (?sort-by=posted groups by posting batch,
       ?sort-by=created is a flat list by document date). #]
    [% template breadcrumb %]
    <li>
        <nav aria-label="breadcrumb">
            <ul typeof="BreadcrumbList" vocab="http://schema.org/">
                <li typeof="ListItem" property="itemListElement">
                    <a href="[[ $context?context-path ]]/" typeof="WebPage" property="item">
                        <pb-i18n key="breadcrumb.home">Home</pb-i18n>
                    </a>
                </li>
                <li typeof="ListItem" property="itemListElement">
                    <a href="[[ $context?context-path ]]/historicaldocuments" typeof="WebPage" property="item">
                        <pb-i18n key="breadcrumb.historicaldocuments">Historical Documents</pb-i18n>
                    </a>
                </li>
                <li typeof="ListItem" property="itemListElement">
                    <a href="[[ $context?context-path ]]/historicaldocuments/frus-history" typeof="WebPage" property="item">
                        <pb-i18n key="menu.frus-history">History of the Foreign Relations Series</pb-i18n>
                    </a>
                </li>
                <li aria-current="page" typeof="ListItem" property="itemListElement">Documents</li>
            </ul>
        </nav>
    </li>
    [% endtemplate %]

    <div class="section-landing usa-prose">
        <h1>Documents</h1>
        <p>In the course of preparing <em>Toward &#8220;Thorough, Accurate, and
            Reliable,&#8221;</em> Joshua Botts, author of the chapters covering recent
            decades, relied on many documents that had not yet been released to the
            public. All those documents have now been reviewed for declassification
            and approved for release; in some cases, documents were released with
            excisions. Over the coming year, the Office of the Historian will
            periodically post some of these records on this website. Check back
            occasionally for the latest additions.</p>
        [[ fh:document-list($context) ]]
    </div>

    [% template before %]
    [% include "templates/pages/historicaldocuments/sidebar.html" %]
    [[ fh:resources-panel($context, "research events") ]]
    [% endtemplate %]
</template>
