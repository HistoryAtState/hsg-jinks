<template>
    ---json
    {
        "templating": {
            "modules": {
                "https://history.state.gov/ns/templates/frus-status": { "at": "modules/templates/frus-status.xqm", "prefix": "status" }
            },
            "extends": "templates/layouts/hsg-content.html"
        },
        "theme": {
            "layout": {
                "before": {
                    "toggle": false
                }
            }
        }
    }
    ---
    [% template! title %]
    <title>Status of the Foreign Relations of the United States Series - Office of the Historian</title>
    [% endtemplate %]

    [% template breadcrumb %]
    <li>
        <nav aria-label="breadcrumb">
            <ul>
                <li>
                    <a href="[[ $context?context-path ]]/">
                        <pb-i18n key="breadcrumb.home">Home</pb-i18n>
                    </a>
                </li>
                <li>
                    <a href="[[ $context?context-path ]]/historicaldocuments">
                        <pb-i18n key="breadcrumb.historicaldocuments">Historical Documents</pb-i18n>
                    </a>
                </li>
                <li aria-current="page">
                    <pb-i18n key="menu.status-of-the-series">Status of the Foreign Relations Series</pb-i18n>
                </li>
            </ul>
        </nav>
    </li>
    [% endtemplate %]

    [# Status of the Series report (OP#1292), reference parity with
       hsg-shell pages/historicaldocuments/status-of-the-series.xml: fixed
       h1 and intro paragraph here, all data-derived sections computed and
       conditionally rendered by status:report (modules/templates/
       frus-status.xqm). One root element: the layout's main lays its
       children out as columns. #]
    <div class="section-landing usa-prose">
        <h1>Status of the <em>Foreign Relations of the United States</em> Series</h1>
        <p><em>Foreign Relations</em> volumes proceed through four main stages of
            production: Planning (when a volume is assigned to a sub-series plan), Research
            (which includes archival research, selection, annotation, and review), Clearance
            (when the manuscript undergoes declassification coordination and is edited and
            prepared for publication), and Publication (when the volume is released to the
            public). This page lists publications released in the current and previous
            calendar year, those planned for release later in the current year, and those at
            various stages of production. A growing number of volumes are published
            incrementally as individual chapters are cleared; volumes with outstanding
            chapters are listed in the table below. Published volumes being digitized are
            also listed.</p>
        [[ status:report($context) ]]
    </div>

    [% template before %]
    [% include "templates/pages/historicaldocuments/sidebar.html" %]
    [% endtemplate %]
</template>
