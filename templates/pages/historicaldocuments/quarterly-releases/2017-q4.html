    <div class="section-landing usa-prose">
        <h1>Quarterly Release of Newly Digitized <em>Foreign Relations</em> Volumes</h1>
        <p>December 7, 2017</p>
        <p>The Department of State today announces the release of newly digitized
            versions of seventeen volumes from the <em>Foreign Relations of the United
                States</em> series, the official documentary record of U.S. foreign
            relations. These volumes cover events that took place between 1900 and 1911
            and were originally published in print between 1902 and 1918:</p>
        <p>
            <em>Papers Relating to the Foreign Relations of the United States,</em>
            1900–1911</p>
        <ol>
            <li>
                <a href="[[ $context?context-path ]]/historicaldocuments/frus1900">Papers Relating to the
                    Foreign Relations of the United States, 1900</a>.</li>
            <li>
                <a href="[[ $context?context-path ]]/historicaldocuments/frus1901">Papers Relating to the
                    Foreign Relations of the United States, With the Annual Message of
                    the President Transmitted to Congress December 3, 1901</a>.</li>
            <li>
                <a href="[[ $context?context-path ]]/historicaldocuments/frus1901China">Foreign Relations of
                    the United States, 1901, Appendix, Affairs in China, Report of
                    William W. Rockhill, Late Commissioner to China, with Accompanying
                    Documents</a>.</li>
            <li>
                <a href="[[ $context?context-path ]]/historicaldocuments/frus1902">Papers Relating to the
                    Foreign Relations of the United States, With the Annual Message of
                    the President Transmitted to Congress December 2, 1902</a>.</li>
            <li>
                <a href="[[ $context?context-path ]]/historicaldocuments/frus1902app1">Foreign Relations of the
                    United States, 1902, Whaling and Sealing Claims Against Russia, On
                    Account of Arrest and Seizure of the American Vessels “Cape Horn
                    Pigeon,” “James Hamilton Lewis,” “C. H. White,” and “Kate and Anna,”
                    Appendix I</a>.</li>
            <li>
                <a href="[[ $context?context-path ]]/historicaldocuments/frus1902app2">Foreign Relations of the
                    United States, 1902, United States vs. Mexico, In the matter of the
                    case of the Pious Fund of the Californias, Appendix II</a>.</li>
            <li>
                <a href="[[ $context?context-path ]]/historicaldocuments/frus1903">Papers Relating to the
                    Foreign Relations of the United States, With the Annual Message of
                    the President Transmitted to Congress December 7, 1903</a>.</li>
            <li>
                <a href="[[ $context?context-path ]]/historicaldocuments/frus1904">Papers Relating to the
                    Foreign Relations of the United States, With the Annual Message of
                    the President Transmitted to Congress December 6, 1904</a>.</li>
            <li>
                <a href="[[ $context?context-path ]]/historicaldocuments/frus1905">Papers Relating to the
                    Foreign Relations of the United States, With the Annual Message of
                    the President Transmitted to Congress December 5, 1905</a>.</li>
            <li>
                <a href="[[ $context?context-path ]]/historicaldocuments/frus1906p1">Papers Relating to the
                    Foreign Relations of the United States, With the Annual Message of
                    the President Transmitted to Congress December 3, 1906, (In two
                    parts), Part I</a>.</li>
            <li>
                <a href="[[ $context?context-path ]]/historicaldocuments/frus1906p2">Papers Relating to the
                    Foreign Relations of the United States, With the Annual Message of
                    the President Transmitted to Congress December 3, 1906, (In two
                    parts), Part II</a>.</li>
            <li>
                <a href="[[ $context?context-path ]]/historicaldocuments/frus1907p1">Papers Relating to the
                    Foreign Relations of the United States, With the Annual Message of
                    the President Transmitted to Congress December 3, 1907, (In two
                    parts), Part I</a>.</li>
            <li>
                <a href="[[ $context?context-path ]]/historicaldocuments/frus1907p2">Papers Relating to the
                    Foreign Relations of the United States, With the Annual Message of
                    the President Transmitted to Congress December 3, 1907, (In two
                    parts), Part II</a>.</li>
            <li>
                <a href="[[ $context?context-path ]]/historicaldocuments/frus1908">Papers Relating to the
                    Foreign Relations of the United States, With the Annual Message of
                    the President Transmitted to Congress December 8, 1908</a>.</li>
            <li>
                <a href="[[ $context?context-path ]]/historicaldocuments/frus1909">Papers Relating to the
                    Foreign Relations of the United States, With the Annual Message of
                    the President Transmitted to Congress December 7, 1909 </a>.</li>
            <li>
                <a href="[[ $context?context-path ]]/historicaldocuments/frus1910">Papers Relating to the
                    Foreign Relations of the United States, With the Annual Message of
                    the President Transmitted to Congress December 6, 1910</a>.</li>
            <li>
                <a href="[[ $context?context-path ]]/historicaldocuments/frus1911">Papers Relating to the
                    Foreign Relations of the United States, With the Annual Message of
                    the President Transmitted to Congress December 7, 1911 </a>.</li>
        </ol>
        <p>Today’s release is part of the Office of the Historian’s ongoing project, in
            partnership with the University of Wisconsin Digital Collections Center, to
            digitize the entire <em>Foreign Relations</em> series. The University
            graciously provided high quality scanned images of each printed book, which
            the Office further digitized to create a full text searchable edition. These
            volumes are available online and as free ebooks at the Office of the
            Historian’s website (<a href="[[ $context?context-path ]]/historicaldocuments"
                >https://history.state.gov/historicaldocuments</a>). This is the latest
            in a series of quarterly releases, which will continue until the
                <em>FRUS</em> digital archive is complete.</p>
    </div>
