<template>
    ---json
    {
        "templating": {
            "modules": {
                "https://history.state.gov/ns/templates/tags": { "at": "modules/templates/tags.xqm", "prefix": "tags" }
            },
            "extends": "templates/layouts/hsg-content.html"
        },
        "theme": {
            "layout": {
                "before": {
                    "toggle": false
                }
            }
        }
    }
    ---
    [% template! title %]
    <title>Tags - Office of the Historian</title>
    [% endtemplate %]

    [% template breadcrumb %]
    [[ hsg:breadcrumbs($context, hsg:section-trail("tags", ())) ]]
    [% endtemplate %]

    <div class="section-landing usa-prose">
        <h1>
            <pb-i18n key="tags.title">Tags</pb-i18n>
        </h1>
        [[ tags:landing-intro($context) ]]
    </div>

    [% template before %]
    [% include "templates/pages/tags/sidebar.html" %]
    [% endtemplate %]
</template>
