<template>
    ---json
    {
        "templating": {
            "modules": {
                "https://history.state.gov/ns/templates/frus-history": { "at": "modules/templates/frus-history.xqm", "prefix": "fh" }
            },
            "extends": "templates/layouts/historicaldocuments-content.html"
        },
        "theme": {
            "layout": {
                "before": {
                    "toggle": false
                }
            }
        }
    }
    ---
    [# FRUS History events page (OP#1294), reference parity with hsg-shell
       pages/historicaldocuments/frus-history/events/index.xml: an Upcoming
       Events section only when any event is still to come, then Recent
       Events, each event's stored full-description fragment rendered as-is
       (fh:events). #]
    [% template breadcrumb %]
    [[ hsg:breadcrumbs($context, hsg:section-trail("historicaldocuments", (hsg:crumb-i18n("menu.frus-history", "History of the Foreign Relations Series", "/historicaldocuments/frus-history"), hsg:crumb("Events", ())))) ]]
    [% endtemplate %]

    <div class="section-landing usa-prose">
        [[ fh:events($context) ]]
    </div>

    [% template before %]
    [[ fh:resources-panel($context, "publications documents research") ]]
    [% endtemplate %]
</template>
