<template>
    ---json
    {
        "templating": {
            "modules": {
                "https://history.state.gov/ns/templates/hsg": { "at": "modules/templates/hsg.xqm", "prefix": "hsg" }
            },
            "extends": "templates/layouts/historicaldocuments-content.html"
        },
        "theme": {
            "layout": {
                "before": {
                    "toggle": false
                }
            }
        }
    }
    ---
    [% template! title %]
    <title>Guide to Sources on Vietnam, 1969-1975 - Historical Documents - Office of the Historian</title>
    [% endtemplate %]

    [% template breadcrumb %]
    [[ hsg:breadcrumbs($context, hsg:section-trail("historicaldocuments", hsg:crumb-i18n("menu.vietnam-guide", "Guide to Sources on Vietnam, 1969-1975", ()))) ]]
    [% endtemplate %]

    [# The TEI "Guide to Sources on Vietnam, 1969-1975" monograph rendered as a single page
       (OP#1301), port of hsg-shell pages/historicaldocuments/vietnam-guide.xml; the content
       comes from the other-publications data package via hsg:vietnam-guide. #]
    <div class="section-landing usa-prose">
        [[ hsg:vietnam-guide($context) ]]
    </div>
</template>
