<template>
    ---json
    {
        "templating": {
            "modules": {
                "https://history.state.gov/ns/templates/countries": { "at": "modules/templates/countries.xqm", "prefix": "countries" }
            },
            "extends": "templates/layouts/countries-content.html"
        }
    }
    ---
    [% template! title %]
    <title>[[ normalize-space(string-join((countries:page-title($context?doc?content, 'Archives - Countries - Office of the Historian')) ! string(.), ' ')) ]]</title>
    [% endtemplate %]

    <div class="usa-prose">
        <h1>[[ countries:article-heading($context?doc?content) ]]</h1>
        [[ page:transform($context?doc?content, map { "mode": "division", "heading-offset": 1 }) ]]
    </div>

    [% template after %]
    <h2 class="usa-in-page-nav__heading">Archives</h2>
    <ul class="usa-in-page-nav__list">
        <li class="usa-in-page-nav__item usa-in-page-nav__item--primary">
            <a href="[[ $context?context-path ]]/countries/archives/all">List of all countries in the
                World Wide Diplomatic Archives Index</a>
        </li>
        <li class="usa-in-page-nav__item usa-in-page-nav__item--primary">
            <a href="[[ $context?context-path ]]/countries/archives">World Wide Diplomatic Archives
                Index</a>
        </li>
    </ul>
    <h3 class="usa-in-page-nav__heading">Related Resources</h3>
    <ul class="usa-in-page-nav__list">
        <li class="usa-in-page-nav__item usa-in-page-nav__item--primary">
            <a href="[[ $context?context-path ]]/countries">
                <pb-i18n key="breadcrumb.countries">Countries</pb-i18n>
            </a>
        </li>
    </ul>
    [% endtemplate %]
</template>
