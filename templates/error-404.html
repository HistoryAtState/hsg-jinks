<html>
    <head>
        <title>Page not found - Office of the Historian</title>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, minimum-scale=1, initial-scale=1, user-scalable=yes" />
        <link rel="shortcut icon" type="image/x-icon" href="[[ $context-path ]]/resources/images/favicon.ico" />

        [% for $path in $styles?* %]
        [% if matches($path, "(?:^https?://|^/).*$") %]
        <link rel="stylesheet" href="[[ $path ]]" />
        [% else %]
        <link rel="stylesheet" href="[[ $context-path ]]/[[ $path ]]" />
        [% endif %]
        [% endfor %]

        <style>
            .fixed-layout > main {
                display: block;
                max-width: var(--jinks-content-max-width);
                margin: 3rem auto;
                padding: 0 1rem;
            }
        </style>
    </head>
    <body>
    <div class="fixed-layout">
        <main class="usa-prose">
            <h1>Page not found</h1>
            <p>The resource you requested could not be found.</p>
            <p><a class="usa-link" href="[[ $context-path ]]/">Return to the home page</a> or
                <a class="usa-link" href="[[ $context-path ]]/search">search the site</a>.</p>
        </main>
    </div>
    </body>
</html>
