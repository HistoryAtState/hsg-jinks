    <div class="section-landing usa-prose">
        <h1>The Historian</h1>
        <p>Past directors of the Office of the Historian are listed below. (For the period before
            the director assumed the title of The Historian, the official listed headed the
            Department component responsible for the production of the <em>Foreign
                Relations</em> series.) For additional information, see <a href="[[ $context?context-path ]]/historicaldocuments/frus-history/appendix-d">Appendix D</a> of
            <em>Toward &#8220;Thorough, Accurate, and Reliable&#8221;: A History of the Foreign
                Relations of the United States Series</em>.</p>
        <ul class="usa-list">
            <li>1919&#8211;1924, Gaillard Hunt (<abbr title="Division of Publications (1921-1929)">DP</abbr>)</li>
            <li>1924, Harry Dwight (<abbr title="Division of Publications (1921-1929)">DP</abbr>)</li>
            <li>1924&#8211;1931, Tyler Dennett (<abbr title="Division of Publications (1921-1929)">DP</abbr>; <abbr title="Office of the Historical Advisor (1929–1933)">HA</abbr>)</li>

            <li>1939&#8211;1946, E. Wilder Spaulding (<abbr title="Division of Research and Publications (1933–1946)">RP</abbr>)</li>
            <li>1946&#8211;1962, George Bernard Noble (<abbr title="Division of Historical Policy Research (1946–1953)">RE</abbr>; <abbr title="Historical Division (1953–1959), under the Bureau of Public Affairs (P)">HD</abbr>; <abbr title="Historical Office (1959–1976), under the Bureau of Public Affairs (P; PA)">HO</abbr>)</li>
            <li>1962&#8211;1974, William Franklin (<abbr title="Historical Office (1959–1976), under the Bureau of Public Affairs (P; PA)">HO</abbr>)</li>
