<template>
    ---json
    {
        "templating": {
            "modules": {
                "https://history.state.gov/ns/templates/about": { "at": "modules/templates/about.xqm", "prefix": "about" }
            },
            "extends": "templates/layouts/hsg-content.html"
        },
        "theme": {
            "layout": {
                "before": {
                    "toggle": false
                }
            }
        }
    }
    ---
    [% template breadcrumb %]
    <li>
        <nav aria-label="breadcrumb">
            <ul>
                [[ about:breadcrumb($context, (map { "label": "Recent Publications" })) ]]
            </ul>
        </nav>
    </li>
    [% endtemplate %]

    <div class="section-landing usa-prose">
        <h1>Recent Publications</h1>
        <p>The Office of the Historian is pleased to announce the recent release of the following
            publications. For more information, see <a href="[[ $context?context-path ]]/historicaldocuments/status-of-the-series">Status of the
                Series</a>.</p>
        <h2><em>Foreign Relations of the United States</em></h2>
        [[ about:recent-publications($context) ]]
    </div>

    [% template before %]
    [% include "templates/pages/about/sidebar.html" %]
    [% endtemplate %]
</template>
