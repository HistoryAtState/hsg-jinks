<template>
    ---json
    {
        "templating": {
            "modules": {
                "https://history.state.gov/ns/templates/search": { "at": "modules/templates/search.xqm", "prefix": "srch" }
            },
            "extends": "templates/layouts/hsg-content.html"
        },
        "script": {
            "custom": [
                "resources/scripts/search-filters.js"
            ]
        }
    }
    ---
    [% template! title %]
    <title>Search - Office of the Historian</title>
    [% endtemplate %]

    [% template breadcrumb %]
    <li>
        <nav aria-label="breadcrumb">
            <ul typeof="BreadcrumbList" vocab="http://schema.org/">
                <li typeof="ListItem" property="itemListElement">
                    <a href="[[ $context-path ]]/" typeof="WebPage" property="item"><pb-i18n key="breadcrumb.home">Home</pb-i18n></a>
                </li>
                <li aria-current="page" typeof="ListItem" property="itemListElement"><pb-i18n key="search.search">Search</pb-i18n></li>
            </ul>
        </nav>
    </li>
    [% endtemplate %]

    [# Same structure as the results page (OP#1436, Figma "Search"): the
       search form in the main column, the "Filter by" sidebar beside it,
       joined to the form through its form attribute. No Sort by here: sorting
       is offered on the results page. #]
    <div class="usa-prose hsg-search-landing">
        <h1><pb-i18n key="search.search">Search</pb-i18n></h1>

        <p>Enter one or more words to search the Office of the Historian website. Use the filters to limit your search to a section or date range. For additional guidance, see <a href="[[ $context-path ]]/search/tips">Search tips</a>.</p>

        <form class="usa-search usa-search--big hsg-search-form" id="hsg-search" role="search" method="get" action="[[ $context-path ]]/search">
            <label class="usa-sr-only" for="search-field">Search</label>
            <input class="usa-input" id="search-field" type="search" name="q" value="[[ page:parameter($context, 'q', '') ]]"/>
            <button class="usa-button" type="submit">
                <span class="usa-search__submit-text">Search</span>
            </button>
        </form>
    </div>

    [% template before %]
    [[ srch:filters($context, false()) ]]
    [% endtemplate %]
</template>
