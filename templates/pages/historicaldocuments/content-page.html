<template>
    ---json
    {
        "templating": {
            "modules": {
                "https://history.state.gov/ns/templates/hsg": { "at": "modules/templates/hsg.xqm", "prefix": "hsg" }
            },
            "extends": "templates/layouts/hsg-content.html"
        },
        "theme": {
            "layout": {
                "before": {
                    "toggle": false
                }
            }
        }
    }
    ---
    [% template! title %]
    <title>[[ normalize-space(string-join((hsg:content-title($context, $context?page-id)) ! string(.), ' ')) || ' - Office of the Historian' ]]</title>
    [% endtemplate %]

    [% template breadcrumb %]
    <li>
        <nav aria-label="breadcrumb">
            <ul>
                <li>
                    <a href="[[ $context?context-path ]]/">
                        <pb-i18n key="breadcrumb.home">Home</pb-i18n>
                    </a>
                </li>
                <li>
                    <a href="[[ $context?context-path ]]/historicaldocuments">
                        <pb-i18n key="breadcrumb.historicaldocuments">Historical Documents</pb-i18n>
                    </a>
                </li>
                <li aria-current="page">
                    <pb-i18n key="menu.[[ $context?page-id ]]">[[ hsg:content-title($context, $context?page-id) ]]</pb-i18n>
                </li>
            </ul>
        </nav>
    </li>
    [% endtemplate %]

    [# One template for every data-driven static of the section (OP#1313, PR #50
       review): the content lives in data/content/{page-id}.xml, rendered
       through the default ODD; page-id arrives from hsgapi:content-page, and
       the breadcrumb falls back to the content document's own title when the
       menu.{page-id} i18n key is absent. #]
    <div class="section-landing usa-prose">
        [[ hsg:content-page($context, $context?page-id) ]]
    </div>
    [% template before %]
    [% include "templates/pages/historicaldocuments/sidebar.html" %]
    [% endtemplate %]
</template>
