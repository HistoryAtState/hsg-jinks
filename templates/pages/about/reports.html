<template>
    ---json
    {
        "templating": {
            "modules": {
                "https://history.state.gov/ns/templates/about": { "at": "modules/templates/about.xqm", "prefix": "about" }
            },
            "extends": "templates/layouts/hsg-content.html"
        },
        "theme": {
            "layout": {
                "before": {
                    "toggle": false
                }
            }
        }
    }
    ---
    [% template! title %]
    <title>Reports - About Us - Office of the Historian</title>
    [% endtemplate %]

    [% template breadcrumb %]
    <li>
        <nav aria-label="breadcrumb">
            <ul typeof="BreadcrumbList" vocab="http://schema.org/">
                [[ hsg:breadcrumb-rdfa(about:breadcrumb($context, (map { "label": "Reports" }))) ]]
            </ul>
        </nav>
    </li>
    [% endtemplate %]

    <div class="section-landing usa-prose">
        <h1>Reports to Congress</h1>
        <p>This page collects reports submitted to Congress in accordance with the requirements
            of Public Law 102-138 (105 Stat. 647, codified in relevant part at 22 U.S.C. &#167;
            4351 et seq.), specifically 22 U.S.C. &#167; 4354(e).</p>
        <p class="text-right"><em>Last updated, February 2026.</em></p>
        <ul class="usa-icon-list">
            <li class="usa-icon-list__item">
                <div class="usa-icon-list__content">
                    <a href="https://static.history.state.gov/reports/report-to-congress-on-frus-for-2025.pdf">Report to Congress on The Foreign Relations of the United States
                        Historical Series for 2025 &#8211; 22 U.S.C. &#167; 4354(e)</a>, February
                    2026 (PDF, 254 KB)
                </div>
            </li>
        </ul>
    </div>

    [% template before %]
    [% include "templates/pages/about/sidebar.html" %]
    [% endtemplate %]
</template>
