<template>
    ---json
    {
        "templating": {
            "modules": {
                "https://history.state.gov/ns/templates/hsg": { "at": "modules/templates/hsg.xqm", "prefix": "hsg" },
                "https://history.state.gov/ns/templates/countries": { "at": "modules/templates/countries.xqm", "prefix": "countries" }
            },
            "extends": "templates/layouts/base.html"
        },
        "script": {
            "custom": [
                "resources/scripts/toc.js"
            ]
        },
        "theme": {
            "layout": {
                "class": "sticky-layout"
            }
        }
    }
    ---
    [% template breadcrumb %]
    [% if exists($context?doc) %]
    <li>
        <nav aria-label="breadcrumb">
            <ul>
                [[
                    (: A page-level "template breadcrumb" override does not take effect here --
                       verified empirically (#1095): a page extending this layout and redefining
                       "template breadcrumb" itself still renders *this* definition, not its own,
                       so per-section breadcrumb logic has to be dispatched from here rather than
                       overridden from the page template. hsg:collection-breadcrumbs is FRUS-only
                       (walks $config:data-default); countries:breadcrumbs covers the other TEI
                       section built on this same shared layout so far (rdcr/wwdai, #1095). Add
                       further sections' dispatch here as they land on hsg-content.html too. :)
                    if (starts-with($context?doc?path, "/db/apps/rdcr/") or starts-with($context?doc?path, "/db/apps/wwdai/")) then
                        countries:breadcrumbs($context)
                    else
                        hsg:collection-breadcrumbs($context)
                ]]
            </ul>
        </nav>
    </li>
    [% endif %]
    [% endtemplate %]

    [% template before %]
    [% if exists($context?doc) %]
    [[ hsg:volume-toc($context) ]]
    [% endif %]
    [% endtemplate %]

    [% template footer %]
    [% include "templates/footer.html" %]
    [% endtemplate %]

    <main>
        [% block above-content %][% endblock %]
        <!-- Content block -->
        [% block content %][% endblock %]
        [% block below-content %][% endblock %]
    </main>
    [% if exists($context?doc) %]
    <pb-document id="document1" path="[[ $context?doc?path ]]" odd="[[ $context?doc?odd ]]" view="[[ $context?doc?view ]]" root-path="[[ $config:data-root ]]" source-view="[[ $page:EXIDE ]]"></pb-document>
    [% endif %]
</template>
