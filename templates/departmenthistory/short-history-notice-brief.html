<!--
    Short History retired-publication notice, brief version; shown on
    every Short History section page (#1135/#1096 PR review), distinct from
    the full notice on the TOC page (departmenthistory-short-history-notice.html).
    Ported verbatim from hsg-shell's
    pages/departmenthistory/short-history/section.xml. Buildings has no
    equivalent; this partial is Short History-only, included by
    departmenthistory-monograph-section.html guarded to
    $context?request?parameters?publication = 'short-history'.
-->
<div class="usa-alert usa-alert--error">
    <div class="usa-alert__body">
        <h2 class="usa-alert__heading">Note to Readers</h2>
        <p class="usa-alert__text">"A Short History of the Department of State" has been retired and is no
            longer maintained. For more information, please see
            <a href="[[ $context?context-path ]]/departmenthistory/short-history">the full notice</a>.</p>
    </div>
</div>
