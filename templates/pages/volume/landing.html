<template>
    ---json
    {
        "templating": {
            "modules": {
                "https://history.state.gov/ns/templates/hsg": { "at": "modules/templates/hsg.xqm", "prefix": "hsg" },
                "https://history.state.gov/ns/templates/tags": { "at": "modules/templates/tags.xqm", "prefix": "tags" }
            },
            "extends": "templates/layouts/historicaldocuments-content.html"
        },
        "theme": {
            "layout": {
                "before": {
                    "hidden": true
                }
            }
        }
    }
    ---
    [# Figma node 4298-66032 (OP#1478): the volume on a white card, and one
       right-hand sidebar with ways to explore, tags and administrations; no
       left sidebar. #]
    [% let $volume = hsg:volume-landing($context) %]
    [% if exists($volume) %]
    [# One root element: the layout's main is a flex row whose children each
       get flex: 1 (resources/css/layout.css). #]
    <article class="hsg-frus__landing">
        <header class="hsg-frus__landing-header">
            [[ hsg:volume-administration-tags($volume?doc) ]]
            <h1>[[ $volume?title ]]</h1>
        </header>
        <div class="hsg-frus__landing-intro">
            [[ hsg:volume-cover($volume?doc, $volume?id, $volume?title) ]]
            <div class="hsg-frus__landing-summary">
                <dl class="hsg-frus__meta">
                    [[ hsg:volume-editors($volume?titleStmt) ]]
                    [[ hsg:volume-published-info($volume?publicationStmt) ]]
                </dl>
                [[ hsg:volume-open-link($context) ]]
            </div>
        </div>
        [[ hsg:volume-landing-toc($context) ]]
    </article>
    [% endif %]
    [% endlet %]

    [% template after %]
    [[ hsg:volume-ways-to-explore($context) ]]
    [% if exists($context?doc) %]
    [[ tags:volume-tags-panel($context) ]]
    [% endif %]
    <nav aria-label="Administrations" class="hsg-frus__administrations">
        [[ hsg:administrations-panel($context) ]]
    </nav>
    [% endtemplate %]
</template>
