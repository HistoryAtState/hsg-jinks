<template>
    ---json
    {
        "templating": {
            "modules": {
                "https://history.state.gov/ns/templates/hsg": { "at": "modules/templates/hsg.xqm", "prefix": "hsg" }
            },
            "extends": "templates/layouts/hsg-content.html"
        },
        "theme": {
            "layout": {
                "before": {
                    "toggle": false
                }
            }
        }
    }
    ---
    [% template breadcrumb %]
    <li>
        <nav aria-label="breadcrumb">
            <ul>
                <li>
                    <a href="[[ $context?context-path ]]/">
                        <pb-i18n key="breadcrumb.home">Home</pb-i18n>
                    </a>
                </li>
                <li>
                    <a href="[[ $context?context-path ]]/historicaldocuments">
                        <pb-i18n key="breadcrumb.historicaldocuments">Historical Documents</pb-i18n>
                    </a>
                </li>
                <li aria-current="page">
                    <pb-i18n key="menu.citing-frus">Citing the Foreign Relations Series</pb-i18n>
                </li>
            </ul>
        </nav>
    </li>
    [% endtemplate %]

    [# Content lives in data/content/citing-frus.xml (OP#1313), the TEI port of the
       static originally transcribed into this template (OP#1299); rendered
       through the default ODD via hsg:content-page. #]
    <div class="section-landing usa-prose">
        [[ hsg:content-page($context, "citing-frus") ]]
    </div>
    [% template before %]
    [% include "templates/pages/historicaldocuments/sidebar.html" %]
    [% endtemplate %]
</template>
