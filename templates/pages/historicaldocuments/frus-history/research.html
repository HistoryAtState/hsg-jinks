<template>
    ---json
    {
        "templating": {
            "modules": {
                "https://history.state.gov/ns/templates/frus-history": { "at": "modules/templates/frus-history.xqm", "prefix": "fh" }
            },
            "extends": "templates/layouts/historicaldocuments-content.html"
        },
        "theme": {
            "layout": {
                "before": {
                    "toggle": false
                }
            }
        }
    }
    ---
    [% template! title %]
    <title>Research - History of the Foreign Relations Series - Historical Documents - Office of the Historian</title>
    [% endtemplate %]

    [# FRUS History research list (OP#1294), reference parity with hsg-shell
       pages/historicaldocuments/frus-history/research/index.xml: the
       sesquicentennial posts, publication date descending, each with linked
       title, byline and first-paragraph teaser (fh:articles-list). #]
    [% template breadcrumb %]
    <li>
        <nav aria-label="breadcrumb">
            <ul typeof="BreadcrumbList" vocab="http://schema.org/">
                <li typeof="ListItem" property="itemListElement">
                    <a href="[[ $context?context-path ]]/" typeof="WebPage" property="item">
                        <pb-i18n key="breadcrumb.home">Home</pb-i18n>
                    </a>
                </li>
                <li typeof="ListItem" property="itemListElement">
                    <a href="[[ $context?context-path ]]/historicaldocuments" typeof="WebPage" property="item">
                        <pb-i18n key="breadcrumb.historicaldocuments">Historical Documents</pb-i18n>
                    </a>
                </li>
                <li typeof="ListItem" property="itemListElement">
                    <a href="[[ $context?context-path ]]/historicaldocuments/frus-history" typeof="WebPage" property="item">
                        <pb-i18n key="menu.frus-history">History of the Foreign Relations Series</pb-i18n>
                    </a>
                </li>
                <li aria-current="page" typeof="ListItem" property="itemListElement">Research</li>
            </ul>
        </nav>
    </li>
    [% endtemplate %]

    <div class="section-landing usa-prose">
        <h1>Research on the Sesquicentennial of the <em>Foreign Relations</em> series</h1>
        <p>A series of ongoing posts exploring the history of the <em>Foreign
            Relations of the United States</em> series</p>
        [[ fh:articles-list($context) ]]
    </div>

    [% template before %]
    [[ fh:resources-panel($context, "publications documents events") ]]
    [% endtemplate %]
</template>
