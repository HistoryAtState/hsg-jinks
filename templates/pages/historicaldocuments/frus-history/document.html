<template>
    ---json
    {
        "templating": {
            "modules": {
                "https://history.state.gov/ns/templates/frus-history": { "at": "modules/templates/frus-history.xqm", "prefix": "fh" }
            },
            "extends": "templates/layouts/hsg-content.html"
        },
        "theme": {
            "layout": {
                "before": {
                    "toggle": false
                }
            }
        }
    }
    ---
    [# Single FRUS History document view (OP#1294): hsgapi:frus-history-
       document resolves the document (unknown ids 404) and threads
       document-id into the context. Reference parity with hsg-shell's
       documents/document.xml: complete title, the sourceDesc scan/PDF note,
       the full body through the ODD, prev/next by document date, and the
       all-documents sidebar with the current document highlighted. #]
    [% template breadcrumb %]
    <li>
        <nav aria-label="breadcrumb">
            <ul typeof="BreadcrumbList" vocab="http://schema.org/">
                [[ hsg:breadcrumb-rdfa(fh:document-breadcrumb($context)) ]]
            </ul>
        </nav>
    </li>
    [% endtemplate %]

    [% template before %]
    [[ fh:document-sidebar($context) ]]
    <div class="hsg-panel hsg-frus__section-nav">
        [% include "templates/pages/historicaldocuments/sidebar.html" %]
    </div>
    [% endtemplate %]

    <div class="usa-prose">
        <h1>[[ fh:document-title($context) ]]</h1>
        [[ fh:document-source($context) ]]
        [[ fh:document-content($context) ]]
        [[ fh:document-pagination($context) ]]
    </div>
</template>
