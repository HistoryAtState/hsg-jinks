# Sample bare-metal nginx configuration for hsg-jinks: aggressive full-page
# caching with an independently-refreshable navigation menu (OP#1284).
#
# The problem: the site header/menu is otherwise rendered inline into every
# page, so a menu change would invalidate every cached page. Instead the app
# exposes the nav as standalone fragments -- GET /menu (desktop) and
# GET /menu-mobile -- and, when proxy caching is enabled, the page layout emits
# an SSI directive (<!--#include virtual=".../menu" -->) in place of the inline
# menu (gated on the `teipublisher.proxy-caching` system property; see
# templates/layouts/base.html). nginx runs its SSI output filter on every
# response it serves -- including cache hits -- issuing a subrequest to /menu
# that is served from the menu's OWN cache. Result: page bodies cache for a
# long time, the menu caches separately, and a menu edit is published
# site-wide by purging just /menu and /menu-mobile -- no page body is evicted.
#
# Enable the app side with: -Dteipublisher.proxy-caching=true on the eXist JVM
# (see the PROXY_CACHING build arg / Dockerfile), then reindex/redeploy so the
# pages emit the SSI includes.
#
# This is a template: adjust upstream host/port, server_name, TLS, and the
# /exist/apps/hsg-jinks prefix to your deployment. Requires the standard nginx
# ssi + proxy modules; the purge location uses ngx_cache_purge (nginx-extras /
# the ngx_cache_purge module). Without that module, publish menu changes by
# bumping a cache key (see PAGE_CACHE_VERSION note) or briefly lowering the
# menu TTL instead.

proxy_cache_path /var/cache/nginx/hsg_pages levels=1:2 keys_zone=hsg_pages:50m
                 max_size=2g inactive=7d use_temp_path=off;
proxy_cache_path /var/cache/nginx/hsg_menu  levels=1:2 keys_zone=hsg_menu:10m
                 max_size=64m inactive=30d use_temp_path=off;

upstream hsg_exist {
    server 127.0.0.1:8080;   # bare-metal eXist (Jetty); adjust to your host/port
}

server {
    listen 80;
    server_name history.state.gov;

    # --- The navigation fragments: cached under their OWN keys ---------------
    # Purge only these to refresh the nav everywhere. Long TTL because content
    # only changes on an explicit menu edit + purge.
    location = /exist/apps/hsg-jinks/menu {
        proxy_pass http://hsg_exist;
        proxy_cache hsg_menu;
        proxy_cache_valid 200 30d;
        proxy_cache_key "$scheme$request_method$host$request_uri";
        add_header X-Cache-Status $upstream_cache_status;
    }
    location = /exist/apps/hsg-jinks/menu-mobile {
        proxy_pass http://hsg_exist;
        proxy_cache hsg_menu;
        proxy_cache_valid 200 30d;
        proxy_cache_key "$scheme$request_method$host$request_uri";
        add_header X-Cache-Status $upstream_cache_status;
    }

    # --- Purge endpoint (restrict to localhost / your ops network) -----------
    # curl -X PURGE http://127.0.0.1/exist/apps/hsg-jinks/menu
    # curl -X PURGE http://127.0.0.1/exist/apps/hsg-jinks/menu-mobile
    location ~ ^/exist/apps/hsg-jinks/(menu|menu-mobile)$ {
        allow 127.0.0.1;
        deny all;
        proxy_cache_purge hsg_menu "$scheme$request_method$host$request_uri";
    }

    # --- Pages: aggressive caching + SSI composition -------------------------
    # ssi on makes nginx resolve the <!--#include virtual=".../menu" --> the
    # page body carries, pulling the fragment from the hsg_menu cache above.
    # The page body itself is cached in hsg_pages and NOT re-fetched when only
    # the menu changed.
    location /exist/apps/hsg-jinks/ {
        proxy_pass http://hsg_exist;
        ssi on;

        proxy_cache hsg_pages;
        # The eXist controller sends `Cache-Control: no-cache` on page routes
        # (controller.xql), so nginx must be told to ignore that to cache page
        # bodies at all. The /menu fragments above send `public, max-age=...`
        # and cache without this, but ignoring there too is harmless.
        proxy_ignore_headers Cache-Control Expires Set-Cookie;
        proxy_cache_valid 200 301 302 1d;
        proxy_cache_valid 404 1m;
        # Keep the query string out of the page cache key only where safe; the
        # default below keys on the full URI so /search?q=... stays distinct.
        proxy_cache_key "$scheme$request_method$host$request_uri";
        # Optional global buster: bump this env/variable + reload to drop ALL
        # page bodies at once (e.g. after a template change), without touching
        # the menu cache. See proxy_cache_key composition in the nginx docs.
        add_header X-Cache-Status $upstream_cache_status;
    }
}

# Publishing a menu change in production:
#   1. Edit config.json menu.items (+ en.json labels), redeploy the app.
#   2. curl -X PURGE http://127.0.0.1/exist/apps/hsg-jinks/menu
#      curl -X PURGE http://127.0.0.1/exist/apps/hsg-jinks/menu-mobile
#   -> next request to ANY page re-runs SSI, fetches the fresh menu, and splices
#      it into the still-cached page body. No full page-cache purge required.
