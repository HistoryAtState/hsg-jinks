<template>
    ---json
    {
        "templating": {
            "modules": {
                "https://history.state.gov/ns/templates/education": { "at": "modules/templates/education.xqm", "prefix": "edu" }
            },
            "extends": "templates/layouts/hsg-content.html"
        },
        "theme": {
            "layout": {
                "before": {
                    "toggle": false
                }
            }
        }
    }
    ---
    [% template! title %]
    <title>Education - Office of the Historian</title>
    [% endtemplate %]

    [% template breadcrumb %]
    <li>
        <nav aria-label="breadcrumb">
            <ul>
                [[ edu:breadcrumb($context, ()) ]]
            </ul>
        </nav>
    </li>
    [% endtemplate %]

    <div class="section-landing usa-prose">
        <h1>Education</h1>

        <div class="usa-alert usa-alert--error">
            <div class="usa-alert__body">
                <h2 class="usa-alert__heading">Note to Readers</h2>
                <p class="usa-alert__text">The educational materials described here have been
                    retired. The original text of this section of the website remains online for
                    reference purposes, but it is no longer being maintained or expanded, nor are
                    the videos or other printed material available for distribution.</p>
                <p class="usa-alert__text" style="text-align: right; font-style: italic">Notice
                    posted on October 2, 2017.</p>
            </div>
        </div>

        <p>Building on its long tradition of working with the academic community, the Office of
            the Historian has expanded its outreach efforts by producing <a href="[[ $context?context-path ]]/education/modules">quality teaching materials</a>
            on diplomacy for American middle and high school students. These include:</p>

        [[ edu:list-modules-brief($context) ]]

        <p>Click <a href="[[ $context?context-path ]]/education/modules">here</a> for a full list.</p>

        <p>The Office of the Historian continues to expand its efforts to integrate teaching about
            American diplomacy into all the social studies disciplines through teacher workshops
            and training sessions at national conferences.</p>
        <p>The Office has also played a foundational role in the first Department of Education
            Teaching American History grant ever awarded on U.S. foreign policy.</p>
    </div>

    [% template before %]
    [% include "templates/pages/education/sidebar-about.html" %]
    [% endtemplate %]
</template>
