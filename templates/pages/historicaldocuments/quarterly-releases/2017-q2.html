    <div class="section-landing usa-prose">
        <h1>Quarterly Release of Newly Digitized <em>Foreign Relations</em> Volumes</h1>
        <p>June 15, 2017</p>
        <p>The Department of State today announces the release of seventeen volumes from
            the <em>Foreign Relations of the United States</em> series, the official
            documentary record of U.S. foreign relations. Sixteen of these volumes are
            newly digitized. These volumes cover events that took place in 1919 and were
            originally published in print between 1934 and 1947.</p>
        <p>These sixteen volumes represent the Office of the Historian’s second
            quarterly release focusing on the United States and the First World War. On
            April 6, the Office released volumes dating from 1913‒1918, documenting the
            advent of war in Europe and the role of the United States in the conflict,
            first as a neutral power and then as combatant. Today’s release continues
            that story with the search for peace and stability in the aftermath of the
            war.</p>

        <p>Today’s release is part of the Office of the Historian’s ongoing project, in
            partnership with the University of Wisconsin Digital Collections Center, to
            digitize the entire <em>Foreign Relations</em> series. The University
            graciously provided high quality scanned images of each printed book, which
            the Office further digitized to create a full text searchable edition. These
            volumes are available online and as free ebooks at the Office of the
            Historian’s website (<a href="[[ $context?context-path ]]/historicaldocuments"
                >https://history.state.gov/historicaldocuments</a>).</p>
        <p>This quarterly release also includes the new publication <em>Foreign
                Relations of the United States</em>, Iran, 1951–1954. This volume
            complements <a href="[[ $context?context-path ]]/historicaldocuments/frus1952-54v10">
                <em>Foreign Relations of the United States</em>, 1952–1954, Volume X,
                Iran, 1951–1954</a>, published in 1989, by providing documentation on
            the use of covert operations by the Truman and Eisenhower administrations. </p>
