<template>
    ---json
    {
        "templating": {
            "modules": {
                "https://history.state.gov/ns/templates/conferences": { "at": "modules/templates/conferences.xqm", "prefix": "conf" }
            },
            "extends": "templates/layouts/hsg-content.html"
        },
        "theme": {
            "layout": {
                "before": {
                    "toggle": false
                }
            }
        }
    }
    ---
    <!--
        Division view: confapi:view-section resolves the division server-side
        and passes conferenceId + sectionId as request parameters, read back
        through $context?request?parameters in conf:current-section. Same
        chrome as conference.html minus the conference-list sidebar (matches
        hsg-shell's section.xml), plus prev/next between sibling divisions.
    -->
    [% template breadcrumb %]
    <li>
        <nav aria-label="breadcrumb">
            <ul>
                [[ conf:section-breadcrumb($context) ]]
            </ul>
        </nav>
    </li>
    [% endtemplate %]

    [% template before %]
    [[ conf:section-sidebar($context) ]]
    [% endtemplate %]

    <div class="usa-prose">
        [[ conf:section-content($context) ]]
        [[ conf:section-pagination($context) ]]
    </div>
</template>
