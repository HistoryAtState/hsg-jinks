<template>
    ---json
    {
        "templating": {
            "modules": {
                "https://history.state.gov/ns/templates/departmenthistory": { "at": "modules/templates/departmenthistory.xqm", "prefix": "dh" }
            },
            "extends": "templates/layouts/hsg-content.html"
        },
        "theme": {
            "layout": {
                "before": {
                    "toggle": false
                }
            }
        }
    }
    ---
    [% template! title %]
    <title>[[ normalize-space(string-join((dh:person-heading($context) || ' - People - Department History - Office of the Historian') ! string(.), ' ')) ]]</title>
    [% endtemplate %]

    [% template breadcrumb %]
    [[ hsg:breadcrumbs($context, dh:person-trail($context)) ]]
    [% endtemplate %]

    <div class="usa-prose">
        [[ dh:person-heading($context) ]]
        [% if not(dh:person-has-bio($context?request?parameters?personId)) %]
        [% include "templates/pages/departmenthistory/hiatus-notice.html" %]
        [% endif %]
        [[ dh:person-body($context) ]]
        <!--
            Metagrid widget (#1141): hsg-shell's version is a jQuery script
            polling api.metagrid.ch client-side; this app has no jQuery, so
            it's not ported as-is. Placeholder container only; a vanilla-JS
            port is a follow-up, not blocking the rest of the page.
        -->
        <aside id="metagrid-wrapper"/>
    </div>

    [% template before %]
    [% include "templates/pages/departmenthistory/sidebar.html" %]
    [% endtemplate %]
</template>
