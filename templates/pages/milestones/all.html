<template>
    ---json
    {
        "templating": {
            "modules": {
                "https://history.state.gov/ns/templates/milestones": { "at": "modules/templates/milestones.xqm", "prefix": "ms" }
            },
            "extends": "templates/layouts/hsg-content.html"
        },
        "theme": {
            "layout": {
                "before": {
                    "toggle": false
                }
            }
        }
    }
    ---
    [% template! title %]
    <title>All Milestones - Milestones - Office of the Historian</title>
    [% endtemplate %]

    <!--
        Flat, cross-era listing of every milestone article (OP#1161).
        ms:all-groups is already the right shape for this: a nested,
        data-driven grouped list, so no rework beyond sourcing it from
        ms:eras() instead of hsg-shell's hand-authored sidebar was needed.
    -->
    [% template breadcrumb %]
    [[ hsg:breadcrumbs($context, ms:all-trail($context)) ]]
    [% endtemplate %]

    [% template before %]
    [[ ms:era-sidebar($context) ]]
    [% endtemplate %]

    <div class="section-landing usa-prose">
        <h1>All Milestones</h1>
        [% include "templates/pages/milestones/retirement-notice-brief.html" %]
        [[ ms:all-groups($context) ]]
    </div>
</template>
