<template>
    ---json
    {
        "templating": {
            "modules": {
                "https://history.state.gov/ns/templates/departmenthistory": { "at": "modules/templates/departmenthistory.xqm", "prefix": "dh" }
            },
            "extends": "templates/layouts/hsg-content.html"
        },
        "theme": {
            "layout": {
                "before": {
                    "toggle": false
                }
            }
        }
    }
    ---
    [% template! title %]
    <title>[[ normalize-space(string-join(((if ($context?request?parameters?publication = 'buildings') then 'Buildings' else 'Short History') || ' - Department History - Office of the Historian') ! string(.), ' ')) ]]</title>
    [% endtemplate %]

    <!--
        Shared TOC page for both Short History and Buildings (#1134):
        dhapi:short-history / dhapi:buildings pass which publication via the
        "publication" request parameter, read back through
        $context?request?parameters?publication in dh:monograph-toc-page /
        dh:monograph-toc-breadcrumb.
    -->
    [% template breadcrumb %]
    <li>
        <nav aria-label="breadcrumb">
            <ul typeof="BreadcrumbList" vocab="http://schema.org/">
                [[ hsg:breadcrumb-rdfa(dh:monograph-toc-breadcrumb($context, $context?request?parameters?publication)) ]]
            </ul>
        </nav>
    </li>
    [% endtemplate %]

    <div class="section-landing usa-prose">
        <h1>[[ dh:monograph-title(dh:monograph-doc($context?request?parameters?publication)) ]]</h1>
        [% if $context?request?parameters?publication = 'short-history' %]
        [% include "templates/pages/departmenthistory/short-history-notice.html" %]
        [% endif %]
        [[ dh:monograph-toc($context, dh:monograph-doc($context?request?parameters?publication), $context?request?parameters?publication, ()) ]]
    </div>

    [% template before %]
    [% include "templates/pages/departmenthistory/sidebar.html" %]
    [% endtemplate %]
</template>
