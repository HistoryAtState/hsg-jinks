<template>
    ---json
    {
        "templating": {
            "extends": "templates/layouts/hsg-content.html"
        }
    }
    ---
    [% if $doc?content//tei:bibl[@type='frus-division-type'] = ('chapter', 'compilation') %]
        [[ page:transform($doc?content, map { "mode": "volume-interior" }) ]]
    [% else %]
        [[ page:transform($doc?content, map { "mode": "division" }) ]]
    [% endif %]
</template>
