<template>
    ---json
    {
        "templating": {
            "modules": {
                "https://history.state.gov/ns/templates/departmenthistory": { "at": "modules/templates/departmenthistory.xqm", "prefix": "dh" }
            },
            "extends": "templates/layouts/hsg-content.html"
        },
        "theme": {
            "layout": {
                "before": {
                    "toggle": false
                }
            }
        }
    }
    ---
    [% template! title %]
    <title>[[ normalize-space(string-join(($context?request?parameters?year || ' - Principals and Chiefs Chronological Listing - People - Department History - Office of the Historian') ! string(.), ' ')) ]]</title>
    [% endtemplate %]

    [% template breadcrumb %]
    [[ hsg:breadcrumbs($context, dh:people-by-year-trail($context, xs:integer($context?request?parameters?year))) ]]
    [% endtemplate %]

    <div class="usa-prose">
        <h1>[[ $context?request?parameters?year ]]</h1>
        [[ dh:people-list($context, dh:people-active-in-year(xs:integer($context?request?parameters?year)), xs:integer($context?request?parameters?year)) ]]
        [[ dh:people-by-year-prev-next($context, xs:integer($context?request?parameters?year)) ]]
    </div>

    [% template before %]
    [% include "templates/pages/departmenthistory/sidebar.html" %]
    [% endtemplate %]
</template>
