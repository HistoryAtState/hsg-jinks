<template>
    <!--
If the profile "landing" is selected together with "uswds",
this template will be used as the default landing page
-->---json
{
        "templating": {
            "extends": "templates/layouts/base.html"
        },
        "features": {
            "toolbar": {
                "enabled": false
            }
        },
        "styles": [
            "resources/css/landing-page.css", "transform/teipublisher.css"
        ],
        "script": {
            "custom": [
                "resources/scripts/language.js"
            ]
        },
        "theme": {
            "layout": {
                "class": "landing-layout"
            }
        }
    }
---
    [% template styles %]
    [% endtemplate %]
    [% template hero %]
    <section class="hero usa-section">
        [[ landing:section($context, 'hero', $landing?content, 'uswds-landing.odd') ]]
    </section>
    [% endtemplate %]
    <section class="usa-section">
        [[ landing:section($context, 'about', $landing?content, 'uswds-landing.odd') ]]
    </section>

    <section class="usa-section">
        [[ landing:section($context, 'highlights', $landing?content, 'uswds-landing.odd') ]]
    </section>

    <section class="usa-section">
        [[ landing:section($context, 'team', $landing?content, 'uswds-landing.odd') ]]
    </section>

    <section class="usa-section">
        [[ landing:section($context, 'section', $landing?content, 'uswds-landing.odd') ]]
    </section>

    [% include "templates/footer.html" %]
    [% include "templates/identifier.html" %]
</template>
