<template>
    ---json
    {
        "templating": {
            "modules": {
                "https://history.state.gov/ns/templates/departmenthistory": { "at": "modules/templates/departmenthistory.xqm", "prefix": "dh" }
            },
            "extends": "templates/layouts/hsg-content.html"
        }
    }
    ---
    [% template breadcrumb %]
    <li>
        <nav aria-label="breadcrumb">
            <ul>
                [[ dh:principal-officers-breadcrumb($context) ]]
            </ul>
        </nav>
    </li>
    [% endtemplate %]

    <div class="usa-prose">
        <h1>Principal Officers, by Title</h1>
        [[ dh:principal-officers-index($context) ]]
    </div>

    [% template after %]
    [% include "templates/departmenthistory-sidebar.html" %]
    [% endtemplate %]
</template>
