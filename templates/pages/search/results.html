<template>
    ---json
    {
        "templating": {
            "modules": {
                "https://history.state.gov/ns/templates/search": { "at": "modules/templates/search.xqm", "prefix": "srch" }
            },
            "extends": "templates/layouts/hsg-content.html"
        },
        "script": {
            "custom": [
                "resources/scripts/search-results.js"
            ]
        },
        "theme": {
            "layout": {
                "before": {
                    "toggle": false
                }
            }
        }
    }
    ---
    [% template! title %]
    <title>Search - Office of the Historian</title>
    [% endtemplate %]

    [% template breadcrumb %]
    <li>
        <nav aria-label="breadcrumb">
            <ul typeof="BreadcrumbList" vocab="http://schema.org/">
                <li typeof="ListItem" property="itemListElement"><a href="[[ $context-path ]]/search" typeof="WebPage" property="item"><pb-i18n key="search.results">Search</pb-i18n></a></li>
                <li typeof="ListItem" property="itemListElement">Results</li>
            </ul>
        </nav>
    </li>
    [% endtemplate %]

    <div class="usa-prose hsg-search-results">
        <h1 class="usa-sr-only"><pb-i18n key="search.results">Search results</pb-i18n></h1>

        <p>Read these <a href="[[ $context-path ]]/search/tips">Search Tips</a> to learn all about the search engine's keyword, date filter, volume filter, and sort functions&#8212;as well as some of the search engine's limitations.</p>

        [# The one search form: the sidebar's filters and the Sort by select
           sit outside it in the markup and join it through their form
           attribute (see $srch:FORM_ID), so every submit carries keyword,
           filters and sort together. #]
        <form class="usa-search usa-search--big hsg-search-form" id="hsg-search" role="search" method="get" action="[[ $context-path ]]/search">
            <label class="usa-sr-only" for="search-field">Search</label>
            <input class="usa-input" id="search-field" type="search" name="q" value="[[ page:parameter($context, 'q', '') ]]"/>
            <button class="usa-button" type="submit">
                <span class="usa-search__submit-text">Search</span>
            </button>
        </form>

        <div class="hsg-results-header">
            <h2 class="hsg-results-header__title">Results</h2>
            [[ srch:sort-select($context) ]]
        </div>

        [[ srch:results-summary($context) ]]
        [[ srch:results-list($context) ]]
        [[ srch:pagination($context) ]]
    </div>

    [% template before %]
    [[ srch:filters($context) ]]
    [% endtemplate %]
</template>
