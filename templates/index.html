<template>
    <!--
If the profile "landing" is selected together with "uswds",
this template will be used as the default landing page
-->---json
{
        "templating": {
            "extends": "templates/layouts/base.html"
        },
        "features": {
            "toolbar": {
                "enabled": false
            }
        },
        "styles": [
            "resources/css/landing-page.css", "transform/teipublisher.css"
        ],
        "script": {
            "custom": [
                "resources/scripts/language.js"
            ]
        },
        "theme": {
            "layout": {
                "class": "landing-layout"
            }
        }
    }
---
    [% template styles %]
    [% endtemplate %]
    [% template hero %]
    [% if $landing?content//tei:div[@type='hero'][p or list] %]
    <section class="hero usa-section">
        [[ landing:section($context, 'hero', $landing?content, 'uswds-landing.odd') ]]
    </section>
    [% endif %]
    [% if $landing?content//tei:div[@type='hero'][not(p) and not(list)] %]
    <section class="hero-title usa-section">
        [[ landing:section($context, 'hero', $landing?content, 'uswds-landing.odd') ]]
    </section>
    <div class="hero-media" role="img" aria-label="[[ $theme?landing?hero?label ]]"/>
    [% endif %]
    [% endtemplate %]
    [% if $landing?content//tei:div[@type='intro'] %]
    <section class="usa-section section-intro">
        [[ landing:section($context, 'intro', $landing?content, 'uswds-landing.odd') ]]
    </section>
    [% endif %]
    [% if $landing?content//tei:div[@type='publications'] %]
    <section class="usa-section section-publications">
        [[ landing:section($context, 'publications', $landing?content, 'uswds-landing.odd') ]]
    </section>
    [% endif %]
    [% block news %]
    [% if $landing?content//tei:div[@type='news'] %]
    <section class="usa-section section-news">
        [[ landing:section($context, 'news', $landing?content, 'uswds-landing.odd') ]]
    </section>
    [% endif %]
    [% endblock %]
    [% if $landing?content//tei:div[@type='about'] %]
    <section class="usa-section">
        [[ landing:section($context, 'about', $landing?content, 'uswds-landing.odd') ]]
    </section>
    [% endif %]
    [% if $landing?content//tei:div[@type='highlights'] %]
    <section class="usa-section">
        [[ landing:section($context, 'highlights', $landing?content, 'uswds-landing.odd') ]]
    </section>
    [% endif %]
    [% if $landing?content//tei:div[@type='team'] %]
    <section class="usa-section">
        [[ landing:section($context, 'team', $landing?content, 'uswds-landing.odd') ]]
    </section>
    [% endif %]
    [% if $landing?content//tei:div[@type='section'] %]
    <section class="usa-section">
        [[ landing:section($context, 'section', $landing?content, 'uswds-landing.odd') ]]
    </section>
    [% endif %]
    [% include "templates/footer.html" %]
    [% include "templates/identifier.html" %]
</template>
