<template>
    ---json
    {
        "templating": {
            "modules": {
                "https://history.state.gov/ns/templates/milestones": { "at": "modules/templates/milestones.xqm", "prefix": "ms" }
            },
            "extends": "templates/layouts/hsg-content.html"
        },
        "theme": {
            "layout": {
                "before": {
                    "toggle": false
                }
            }
        }
    }
    ---
    <!--
        Milestones section landing page (OP#1160): full retirement notice,
        intro prose, era select dropdown, and the cross-era sidebar list, all
        rendered from the data collection (ms:eras()) rather than hsg-shell's
        hand-authored, staleness-prone static lists.
    -->
    [% template breadcrumb %]
    <li>
        <nav aria-label="breadcrumb">
            <ul>
                [[ ms:breadcrumb($context, ()) ]]
            </ul>
        </nav>
    </li>
    [% endtemplate %]

    [% template before %]
    [[ ms:era-sidebar($context) ]]
    [% endtemplate %]

    <div class="section-landing usa-prose">
        <h1>Milestones in the History of U.S. Foreign Relations</h1>
        [% include "templates/pages/milestones/retirement-notice.html" %]
        <p>"Milestones in the History of U.S. Foreign Relations" provides a general overview of the history of U.S.
            engagement with the world through short essays on important moments, or milestones, in the diplomatic
            history of the United States. The basic objective of these essays is to provide a clear, accurate,
            narrative account of the events being discussed, with a brief discussion of each event's significance
            for U.S. foreign policy and diplomatic history. The publication is divided into 19 chapters covering
            time periods from 1750 until 2000, with brief introductions providing context for each period.</p>
        <form action="" class="usa-form">
            <label class="usa-label" for="milestones-era-select">Select a period</label>
            [[ ms:era-select($context) ]]
        </form>
        <p>To begin, select a period above or from the sidebar, or view a list of
            <a href="[[ $context?context-path ]]/milestones/all">all milestones</a>.</p>
    </div>
</template>
