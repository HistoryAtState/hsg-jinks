    <div class="section-landing usa-prose">
        <h1>
            <pb-i18n key="about.title">About Us</pb-i18n>
        </h1>
        <p>
            <a class="usa-button" href="https://static.history.state.gov/about/office-of-the-historian-brochure.pdf">Download our brochure (PDF, 2.4mb)</a>
        </p>

        <h2>Who We Are</h2>
        <p>The Office of the Historian is staffed by professional historians who are experts in
            the history of U.S. foreign policy and the institutional history of the Department of
            State. Our historians possess unparalleled research experience in State Department and
            other government records. The Office is directed by <a href="[[ $context?context-path ]]/about/the-historian">The Historian of the
                U.S. Department of State</a>.</p>

        <h2>What We Do</h2>
        <p>The Office of the Historian is responsible, under law, for the preparation and
            publication of the official documentary history of U.S. foreign policy in the <em><a href="[[ $context?context-path ]]/historicaldocuments">Foreign Relations of the United
                    States</a></em> (FRUS) series. The FRUS series presents the official
            documentary historical record of major U.S. foreign policy decisions. The series began
            in 1861 and now comprises more than 550 individual publications. FRUS publications
            contain historical documents from the Departments of State and Defense, the White
            House, National Security Council, Intelligence Community, and other agencies across
            the national security establishment. Our historians compiling FRUS have full and
            complete access to records in the Presidential libraries, the National Archives, and
            Department and agency repositories.</p>
        <p>The Office prepares historical and institutional studies for Department principals
            that provide essential context, evaluate how and why policies evolved, identify
            precedents, and derive lessons learned.</p>

        <h2>Our Outreach Activities</h2>
        <p>Our Office provides information to the American people about the Department and its
            history; U.S. foreign relations and resources to conduct research on Department
            records; and responds to content-specific questions about FRUS series.</p>

        <h2>How to Access Our Materials</h2>
        <p>In addition to a <a href="[[ $context?context-path ]]/historicaldocuments">full text archive of the <em>Foreign
                    Relations</em> series</a>, our website includes valuable encyclopedic content
            on the history of <a href="[[ $context?context-path ]]/countries">U.S. relations with states around the
                world</a>, and a database of the <a href="[[ $context?context-path ]]/departmenthistory/people">Department&#8217;s principal officers and
                chiefs of mission</a>.</p>
        <p>In keeping with the Open Government Directive&#8217;s principle of transparency,
            participation, and collaboration as the cornerstone of an open government, all of the
            content and code on this site is available for free download. The core repositories
            are available at <a href="https://github.com/HistoryAtState">HistoryAtState</a> on
            GitHub. Follow our progress, fork our code, file issues, and send us your pull
            requests. The <a href="https://github.com/HistoryAtState/hsg-project">hsg-project</a>
            repository contains all instructions to install a complete copy of the
            history.state.gov website on your own computer. Please visit our <a href="[[ $context?context-path ]]/open">Open Government</a> page to learn more about our
            contributions to data.gov.</p>
