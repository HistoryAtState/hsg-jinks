name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A run on main may end in a release; never cancel one halfway.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  cypress:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out the app
        uses: actions/checkout@v4

      # The baseline is the image the app goes live with: eXist 7 with the
      # libraries, the HistoryAtState data packages and frus-data-jinks (with
      # its vector index) baked into the database. Port 8080 is what
      # .devcontainer/init.sh and cypress.config.cjs expect. Pinned to the
      # same digest as .devcontainer/Dockerfile.dev.
      - name: Start the baseline image
        run: |
          docker run -d --name exist -p 8080:8080 joewiz/hsg-project:v2@sha256:99cbf7e1bb1c37d28f4a0e815e3cc2614ad2c3b519312982134c450a68345930
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/exist/rest/db || true)
            echo "attempt $i: HTTP $code"
            [ "$code" = "200" ] && exit 0
            sleep 5
          done
          docker logs exist | tail -100
          exit 1

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .tool-versions
          cache: npm

      - name: Install dependencies
        run: |
          npm ci
          npm install -g @existdb/xst@4.1.0

      # Same seed path as the devcontainer, but with the build the production
      # image ships (ant -Dproduction=true, README "Production Docker image"),
      # installed over the image's own hsg-jinks.
      - name: Install the production build of the app
        env:
          PRODUCTION: "true"
        run: sh .devcontainer/init.sh

      - name: Check the app answers
        run: curl -sf -o /dev/null http://localhost:8080/exist/apps/hsg-jinks/index.html

      - name: Run Cypress
        run: npx cypress run --config video=false --env PRODUCTION_BUILD=true

      - name: Upload screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-screenshots
          path: test/cypress/screenshots
          if-no-files-found: ignore

      - name: eXist log
        if: failure()
        run: docker logs exist 2>&1 | tail -300

  commitlint:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: wagoid/commitlint-github-action@v6

  # semantic-release: version from the conventional commits since the last
  # v* tag, production build, tag + GitHub release with the xar. Nothing is
  # committed back to main (README "Releases").
  release:
    needs: cypress
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version-file: .tool-versions
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install Ant
        run: |
          sudo apt-get update
          sudo apt-get install -y ant

      - run: npm ci

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release
