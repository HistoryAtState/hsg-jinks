<template>
    ---json
    {
        "templating": {
            "modules": {
                "https://history.state.gov/ns/templates/frus-history": { "at": "modules/templates/frus-history.xqm", "prefix": "fh" }
            },
            "extends": "templates/layouts/hsg-content.html"
        },
        "theme": {
            "layout": {
                "before": {
                    "toggle": false
                }
            }
        }
    }
    ---
    [% template! title %]
    <title>[[ normalize-space(string-join((fh:article-title($context)) ! string(.), ' ')) || ' - Office of the Historian' ]]</title>
    [% endtemplate %]

    [# Single research article view (OP#1294): hsgapi:frus-history-article
       resolves the article (unknown ids 404) and threads article-id into the
       context. Reference parity with hsg-shell's research/article.xml:
       schema.org Article microdata on the content wrapper, byline with
       author/sourceOrganization/datePublished itemprops, sourceDesc
       description, body through the ODD, prev/next by publication date, and
       the article-list sidebar with the current article highlighted. #]
    [% template breadcrumb %]
    <li>
        <nav aria-label="breadcrumb">
            <ul>
                [[ fh:article-breadcrumb($context) ]]
            </ul>
        </nav>
    </li>
    [% endtemplate %]

    [% template before %]
    [[ fh:article-sidebar($context) ]]
    <div class="hsg-panel hsg-frus__section-nav">
        [% include "templates/pages/historicaldocuments/sidebar.html" %]
    </div>
    [% endtemplate %]

    <div class="usa-prose" itemscope="itemscope" itemtype="http://schema.org/Article">
        <h1>[[ fh:article-title($context) ]]</h1>
        [[ fh:article-byline($context) ]]
        [[ fh:article-description($context) ]]
        [[ fh:article-content($context) ]]
        [[ fh:article-pagination($context) ]]
    </div>
</template>
