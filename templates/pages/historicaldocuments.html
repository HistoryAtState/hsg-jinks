<template>
    ---json
    {
        "templating": {
            "modules": {
                "https://history.state.gov/ns/templates/hsg": { "at": "modules/templates/hsg.xqm", "prefix": "hsg" }
            },
            "extends": "templates/layouts/hsg-content.html"
        }
    }
    ---
    <!-- One root element: the layout's main is a flex row whose children each
         get flex: 1 (resources/css/layout.css, .sticky-layout > main), so a
         template emitting siblings would lay them out as columns. -->
    <div class="section-landing">
        <h1>
            <pb-i18n key="historicaldocuments.title">Historical Documents</pb-i18n>
        </h1>
        <ul class="volume-list">
            [[ hsg:volume-list($context) ]]
        </ul>
    </div>
</template>
