    <div class="section-landing usa-prose">
        <h1>Quarterly Release of Newly Digitized <em>Foreign Relations</em> Volumes</h1>
        <p>September 6, 2017</p>
        <p>The Department of State today announces the release of thirty-two volumes
            from the <em>Foreign Relations of the United States</em> series, the
            official documentary record of U.S. foreign relations. These thirty-two
            volumes cover events that took place between 1920 and 1941 and were
            originally published in print between 1935 and 1943.</p>

        <p>Today’s release is part of the Office of the Historian’s ongoing project, in
            partnership with the University of Wisconsin Digital Collections Center, to
            digitize the entire <em>Foreign Relations</em> series. The University
            graciously provided high quality scanned images of each printed book, which
            the Office further digitized to create a full text searchable edition. These
            volumes are available online and as free ebooks at the Office of the
            Historian’s website (<a href="[[ $context?context-path ]]/historicaldocuments"
                >https://history.state.gov/historicaldocuments</a>).</p>
